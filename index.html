    <style>
:root{
  --bg:#0b0d10;--panel:#13171d;--panel2:#191f27;--text:#f5f7fa;--muted:#9aa4b2;

}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
body{min-height:100vh;background:
 radial-gradient(circle at 15% -10%,rgba(184,255,61,.12),transparent 35%),
 radial-gradient(circle at 100% 0,rgba(78,225,255,.08),transparent 30%),var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:92px}

.brand{font-weight:900;letter-spacing:-.5px;font-size:20px}.brand span{color:var(--accent)}

.card.soft{box-shadow:none;background:var(--panel)}

.btn.primary{background:var(--accent);color:#11160b;border-color:transparent}.btn.ghost{background:transparent}.btn.full{width:100%}.btn.small{padding:9px 12px;border-radius:12px;font-size:13px}.btn.danger{background:rgba(255,100,100,.12);color:#ff8f8f;border-color:rgba(255,100,100,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.choice .icon{font-size:23px}.choice b{font-size:14px}.choice span{font-size:12px;color:var(--muted)}

label{font-size:13px;color:#d8dee7;font-weight:750;display:block;margin-bottom:8px}.field{margin-bottom:14px}

.stat{padding:13px;border:1px solid var(--line);border-radius:16px;background:#11151a}.stat strong{font-size:21px;display:block}.stat span{font-size:12px;color:var(--muted)}
.pill{padding:7px 10px;border-radius:999px;background:#1f2730;border:1px solid var(--line);font-size:12px;color:#dce3ea}.pill.accent{background:rgba(184,255,61,.1);border-color:rgba(184,255,61,.25);color:var(--accent)}
.workout-card{padding:18px;background:linear-gradient(145deg,rgba(184,255,61,.12),rgba(78,225,255,.06) 55%,var(--panel));border:1px solid rgba(184,255,61,.22);border-radius:26px;margin-bottom:14px}
.workout-card h2{font-size:25px;margin:7px 0 4px;letter-spacing:-.8px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0 14px}
.exercise{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:none}.exicon{width:42px;height:42px;border-radius:12px;background:#0f1419;display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}.exercise b{font-size:14px}.exercise small{color:var(--muted)}
.day{padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}.day.today{border-color:rgba(184,255,61,.4)}.day.done{opacity:.72}.day .date{font-size:12px;color:var(--muted)}

.counterbox{margin:14px 0 12px;padding:16px;border:1px solid rgba(184,255,61,.22);background:linear-gradient(145deg,rgba(184,255,61,.08),rgba(78,225,255,.035));border-radius:20px}
.countertop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.countertop b{font-size:13px}.countertop span{font-size:12px;color:var(--muted)}
.countermain{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center}.counterbtn{height:58px;border-radius:18px;border:1px solid var(--line);background:#10161c;color:var(--text);font-size:30px;font-weight:700}.counterbtn:active{transform:scale(.97)}
.counternum{text-align:center}.counternum strong{display:block;font-size:54px;line-height:.9;letter-spacing:-2px}.counternum span{display:block;margin-top:7px;color:var(--muted);font-size:12px}
.setstatus{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.setdot{height:8px;flex:1;min-width:24px;border-radius:99px;background:#27313b}.setdot.done{background:var(--accent)}.setdot.current{box-shadow:0 0 0 1px var(--accent) inset}

.detailsbox{margin-top:10px}.detailsbox summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:750;padding:6px 0}.exercisehead{display:flex;align-items:center;gap:11px}.exercisehead .exicon{flex:none}.exercisehead .exmeta{min-width:0}.exercisehead .exmeta b{display:block}.exercisehead .exmeta span{font-size:12px;color:var(--muted)}

/* V1.2 — workout timers + 3D coach */
.timergrid{display:grid;grid-template-columns:1.05fr .95fr;gap:10px;margin:12px 0}.timerbox{padding:13px;border:1px solid var(--line);border-radius:17px;background:#0d1217}.timerbox.active{border-color:rgba(184,255,61,.5);box-shadow:inset 0 0 0 1px rgba(184,255,61,.15)}.timerlabel{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.timervalue{font-variant-numeric:tabular-nums;font-size:27px;font-weight:950;letter-spacing:-1px;margin:4px 0 8px}.timeractions{display:flex;gap:6px}.timeractions .btn{flex:1;padding:8px 7px;font-size:11px}

.focus-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.focus-controls .timerbox{margin:0}.focus-counter{margin-top:10px}.focus-counter .countermain{grid-template-columns:72px 1fr 72px}.focus-counter .counterbtn{height:66px}.focus-counter .counternum strong{font-size:62px}.focus-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.focus-actions .btn:last-child{grid-column:1/-1}.mode-switch{display:flex;gap:6px}.mode-switch .btn{padding:8px 10px;font-size:11px}

.exlib-row{cursor:pointer;transition:.15s}.exlib-row:active{transform:scale(.992)}.exlib-arrow{color:var(--muted);font-size:18px}.exercise-detail-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;align-items:flex-end}.exercise-detail{width:min(480px,100%);max-height:94vh;overflow:auto;margin:0 auto;background:#10151b;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -30px 90px rgba(0,0,0,.45)}.detail-grab{width:44px;height:4px;border-radius:99px;background:#35404b;margin:0 auto 12px}.detail-title{font-size:25px;margin:6px 0 2px}.detail-meta{color:var(--muted);font-size:12px;margin-bottom:12px}.detail-close{position:sticky;top:0;z-index:4;display:flex;justify-content:flex-end;pointer-events:none}.detail-close button{pointer-events:auto}
.prgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.prcard{border:1px solid var(--line);background:#10151a;border-radius:16px;padding:12px}.prcard strong{font-size:18px;display:block}.prcard span{font-size:11px;color:var(--muted)}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:none}.switch{width:48px;height:28px;border-radius:99px;border:1px solid var(--line);background:#202832;position:relative}.switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#dce4ec;top:3px;left:4px;transition:.18s}.switch.on{background:rgba(184,255,61,.18);border-color:rgba(184,255,61,.38)}.switch.on:after{left:23px;background:var(--accent)}
.restpanel.v13{bottom:12px}.rest-hint{font-size:10px;color:var(--muted);margin-top:4px}.rest-next{font-size:11px;color:#dfffb5;margin-top:2px}.restpanel.ready .rest-next{color:#c7f8ff}

<style id="v311-ui-stability">

  padding-right:max(10px,env(safe-area-inset-right))!important
}

function available(ex){return ex.eq.every(e=>state.profile.equipment.includes(e))}
function pick(pattern,count,boost=0){
  const lv=state.profile.levels[pattern]+boost;
  let pool=EXERCISES.filter(e=>e.pattern===pattern&&available(e)).sort((a,b)=>Math.abs(a.diff-lv)-Math.abs(b.diff-lv));
  const picked=[];
  for(const e of pool){if(!picked.some(p=>p.id===e.id)&&picked.length<count)picked.push(e)}
  return picked;
}

  const goal=state.profile.goal;
  let sets=goal==='strength'?4:goal==='fatloss'?3:3;
  let lo=ex.rep[0],hi=ex.rep[1];
  if(state.week>1){const bump=Math.min(3,state.week-1);lo+=ex.type==='time'?bump*2:Math.floor(bump/2);hi+=ex.type==='time'?bump*3:bump}

  };
  state.plan=templates[d].map((t,i)=>({...makeWorkout(...t),dayIndex:i}));

}
function todayPlanIndex(){const done=state.plan.filter(w=>w.completed).length;return Math.min(done,state.plan.length-1)}
function workoutProgress(w){if(!w?.log)return 0;const total=w.log.reduce((a,e)=>a+e.sets.length,0);const done=w.log.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);return total?Math.round(done/total*100):0}

function renderGuide(e){const g=guideFor(e.id);return `<button class="guidebtn" onclick="toggleGuide('${e.id}')"><span>🧍 Xem HLV 3D & kỹ thuật</span><span>⌄</span></button><div class="guide" id="guide-${e.id}">${visualDemo(e)}<h4 style="margin-top:14px">Chuẩn bị</h4><p>${g.setup}</p><h4>Cách thực hiện</h4><ul>${g.steps.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Điểm cần nhớ</h4><ul>${g.cues.map(x=>`<li>${x}</li>`).join('')}</ul><h4 class="warning">Lỗi thường gặp</h4><ul class="warning">${g.mistakes.map(x=>`<li>${x}</li>`).join('')}</ul><div class="breath">🫁 ${g.breathing}</div></div>`}
function renderWorkout(){

      <div class="timergrid"><div class="timerbox ${active?'active':''}"><div class="timerlabel">⏱ Thời gian set ${e.type==='time'?'• countdown':'• count up'}</div><div class="timervalue" id="settimer-${ei}">${fmtTime(active?setTimerSeconds(ei,si):0)}</div><div class="timeractions"><button class="btn ${active&&t.running?'primary':''}" id="settimer-btn-${ei}" onclick="toggleSetTimer(${ei})" ${done===e.sets.length?'disabled':''}>${timerButtonLabel(ei,si)}</button><button class="btn" onclick="resetSetTimer(${ei})" ${done===e.sets.length?'disabled':''}>↺ Reset</button></div></div><div class="timerbox"><div class="timerlabel">☕ Nghỉ đề xuất</div><div class="timervalue">${fmtTime(e.rest||75)}</div><div class="sub">Tự chạy ngay khi bạn hoàn thành set.</div></div></div>
      <div class="counterbox"><div class="countertop"><b>${done===e.sets.length?'✅ Đã hoàn thành bài':'SET '+(si+1)+' / '+e.sets.length}</b><span>${done===e.sets.length?'Chuyển bài tiếp theo':e.type==='time'?'Timer sẽ tự đếm giây':'Đếm reps thực tế'}</span></div>

        <div class="setstatus">${e.sets.map((s,i)=>`<span class="setdot ${s.done?'done':(!s.done&&i===si?'current':'')}"></span>`).join('')}</div>

      <div class="row between" style="margin-top:12px"><span class="sub">Còn khoảng bao nhiêu reps?</span><div class="row">${[0,1,2,3].map(r=>`<button class="btn small ${e.rir===r?'primary':''}" onclick="setRir(${ei},${r})">${r}${r===3?'+':''}</button>`).join('')}</div></div>
    </div>`}).join('')}
    <button class="btn primary full" onclick="finishWorkout()">Hoàn thành buổi tập</button><div style="height:110px"></div>
  </main>${renderRestPanel()}`;updateTimerDOM();
}
function exitWorkout(){if(!confirm('Thoát Workout Mode? Tiến độ set đã lưu và có thể tiếp tục sau.'))return;state.currentWorkout=null;save();render()}
function setVal(ei,si,v){state.currentWorkout.log[ei].sets[si].value=Math.max(0,Number(v)||0);save();const current=currentSetIndex(state.currentWorkout.log[ei]);if(current===si){const el=document.getElementById(`counter-${ei}`);if(el)el.textContent=state.currentWorkout.log[ei].sets[si].value}}
function adjustCount(ei,delta){const e=state.currentWorkout.log[ei];if(setCount(e)===e.sets.length)return;const si=currentSetIndex(e),s=e.sets[si];s.value=Math.max(0,(Number(s.value)||0)+delta);save();const el=document.getElementById(`counter-${ei}`);if(el)el.textContent=s.value}
function completeCurrentSet(ei){const e=state.currentWorkout.log[ei];if(setCount(e)===e.sets.length)return;const si=currentSetIndex(e),s=e.sets[si];if(e.type!=='time'&&s.value<=0&&!confirm('Bộ đếm đang là 0. Bạn vẫn muốn đánh dấu set này hoàn thành?'))return;const dur=stopAndStoreSetTimer(ei,si);if(e.type==='time'&&s.value<=0&&dur)s.value=dur;if(e.type==='time'&&s.value<=0&&!confirm('Set thời gian chưa có dữ liệu. Vẫn hoàn thành?'))return;s.done=true;startRestTimer(e.rest||75,ei);save();renderWorkout();setTimeout(()=>document.getElementById(`exercise-${ei}`)?.scrollIntoView({behavior:'smooth',block:'center'}),30)}
function toggleSet(ei,si){const s=state.currentWorkout.log[ei].sets[si];s.done=!s.done;if(!s.done&&state.currentWorkout.setTimer?.ei===ei)state.currentWorkout.setTimer=null;save();renderWorkout()}
function setRir(ei,r){state.currentWorkout.log[ei].rir=r;save();renderWorkout()}
function toggleGuide(id){const el=document.getElementById(`guide-${id}`);if(!el)return;el.classList.toggle('open');if(el.classList.contains('open'))setTimeout(()=>init3D(id),30)}
function finishWorkout(){
  const cw=state.currentWorkout;const w=state.plan.find(x=>x.id===cw.planId);const pct=workoutProgress(cw);
  if(pct<60&&!confirm('Bạn mới hoàn thành dưới 60% số set. Vẫn kết thúc?'))return;
  const avgRir=cw.log.reduce((a,e)=>a+e.rir,0)/cw.log.length;
  w.completed=true;w.completedAt=Date.now();w.performance={pct,avgRir,log:cw.log};
  state.history.push({week:state.week,title:w.title,pct,avgRir,date:Date.now(),durationMin:state.profile.minutes,exercises:w.exercises.length,levelSnapshot:{...state.profile.levels}});if(v24db){const sid=v24ID('session'),now=Date.now(),dk=new Date(now).toISOString().slice(0,10);v24Put('sessions',{id:sid,date:now,title:w.title,completion:pct,avgRir,durationMin:state.profile.minutes,exerciseCount:w.exercises.length});v24Put('calendar',{id:dk,date:dk,minutes:state.profile.minutes,completion:pct,workouts:1})}state.xp+=Math.round(80+pct*.6);state.streak+=1;state.currentWorkout=null;
  save();toast(`+${Math.round(80+pct*.6)} XP • Buổi tập hoàn thành`);render();
}
function nextWeek(){
  const completed=state.plan.filter(w=>w.completed).length;
  const adherence=completed/state.plan.length;
  const perfs=state.plan.filter(w=>w.performance);
  const avgPct=perfs.length?perfs.reduce((a,w)=>a+w.performance.pct,0)/perfs.length:0;
  const avgRir=perfs.length?perfs.reduce((a,w)=>a+w.performance.avgRir,0)/perfs.length:1;
  const score=Math.round(adherence*40+Math.min(30,avgPct*.3)+clamp(avgRir,0,3)/3*20+10);
  state.weekScore=score;
  let delta=0;if(score>=90)delta=.35;else if(score>=80)delta=.2;else if(score<50)delta=-.2;else if(score<65)delta=-.1;
  Object.keys(state.profile.levels).forEach(k=>state.profile.levels[k]=clamp(state.profile.levels[k]+delta,1,5));
  state.week++;
  generatePlan(false);
  state.weekScore=score;save();toast(score>=80?'Tuần mới đã được tăng độ khó 🔥':'Tuần mới đã được điều chỉnh');render();
}

function v23LevelRange(l){return l==='beginner'?[0,2.2]:l==='intermediate'?[1.7,3.3]:l==='advanced'?[2.8,4.3]:l==='elite'?[3.8,9]:[0,9]}

function v23Readiness(){const recent=state.history.slice(-3);if(!recent.length)return 72;const c=recent.reduce((a,x)=>a+x.pct,0)/recent.length;const rir=recent.reduce((a,x)=>a+(x.avgRir||1),0)/recent.length;return Math.round(clamp(c*.7+rir*8,45,100))}
function v23DailyDelta(){const r=v23Readiness();return r>=88?.12:r>=75?.06:r<55?-.10:0}
function v23DailyAdapt(){const key=new Date().toISOString().slice(0,10);if(state.v23.daily.some(x=>x.date===key))return;const delta=v23DailyDelta();Object.keys(state.profile.levels).forEach(k=>state.profile.levels[k]=clamp(state.profile.levels[k]+delta,1,5));state.v23.daily.push({date:key,readiness:v23Readiness(),delta,levels:{...state.profile.levels}});state.v23.daily=state.v23.daily.slice(-60);save()}
function v23SkillScores(){const ids=state.history.length;const L=state.profile.levels;return {pushup:Math.min(10,Math.round(L.push*2+ids*.05)),pullup:Math.min(10,Math.round(L.pull*2+ids*.04)),lsit:Math.min(10,Math.round(L.core*1.8+ids*.03)),handstand:Math.min(10,Math.round((L.push+L.core)*.85+ids*.02))}}
function v23Stats(){const H=state.history,total=H.length,avg=total?Math.round(H.reduce((a,x)=>a+x.pct,0)/total):0,mins=total*(state.profile.minutes||45),volume=H.reduce((a,x)=>a+(x.pct||0),0);return {total,avg,mins,volume,readiness:v23Readiness()}}
function v23Progress(){const S=v23Stats(),skills=v23SkillScores(),bars=state.history.slice(-14);const bmi=(state.v23.body.weight/((state.v23.body.height/100)**2)).toFixed(1);return `<div class="topbar"><div><div class="brand">PROGRESS <span>V3.0</span></div><div class="kicker">Dữ liệu luyện tập thực tế trên thiết bị</div></div><span class="pill accent">${state.xp} XP</span></div><main><div class="hero"><div class="eyebrow">Biomechanical + Adaptive</div><h1>Tiến bộ của bạn.</h1><p>Dữ liệu bên dưới lấy từ các buổi bạn thực sự hoàn thành trong ForgePath, không phải số demo.</p></div><div class="v23-grid"><div class="v23-card"><div class="v23-metric">${S.total}</div><div class="v23-muted">Buổi đã tập</div></div><div class="v23-card"><div class="v23-metric">${S.avg}%</div><div class="v23-muted">Completion TB</div></div><div class="v23-card"><div class="v23-metric">${S.mins}</div><div class="v23-muted">Phút luyện tập</div></div><div class="v23-card"><div class="v23-metric">${S.readiness}</div><div class="v23-muted">Readiness /100</div></div></div><div class="section-title">14 buổi gần nhất</div><div class="card"><div class="v23-spark">${bars.length?bars.map(x=>`<i style="height:${Math.max(8,x.pct)}%" title="${x.pct}%"></i>`).join(''):'<span class="v23-muted">Chưa có dữ liệu. Hoàn thành buổi tập đầu tiên để tạo biểu đồ.</span>'}</div></div><div class="section-title">Kỹ năng đang phát triển</div><div class="card">${Object.entries(skills).map(([k,v])=>`<div style="margin:11px 0"><div class="row between"><b>${({pushup:'Push-up',pullup:'Pull-up',lsit:'L-sit',handstand:'Handstand'})[k]}</b><span>${v}/10</span></div><div class="v23-bar"><i style="width:${v*10}%"></i></div></div>`).join('')}</div><div class="section-title">Strength profile</div><div class="card soft">${Object.entries(state.profile.levels).map(([k,v])=>levelRow(k,v)).join('')}</div><div class="section-title">Cơ thể</div><div class="v23-grid"><div class="v23-card"><div class="v23-metric">${state.v23.body.weight} kg</div><div class="v23-muted">Cân nặng</div></div><div class="v23-card"><div class="v23-metric">${state.v23.body.height} cm</div><div class="v23-muted">Chiều cao</div></div><div class="v23-card"><div class="v23-metric">${bmi}</div><div class="v23-muted">BMI</div></div><div class="v23-card"><div class="v23-metric">W${state.week}</div><div class="v23-muted">Tuần hiện tại</div></div></div><div class="section-title">Thành tựu</div><div class="v23-ach"><div><b>🏁</b><small>Buổi đầu</small></div><div><b>${state.streak>=7?'🔥':'🔒'}</b><small>7 ngày</small></div><div><b>${S.total>=50?'🏆':'🔒'}</b><small>50 buổi</small></div></div></main>${bottomNav('progress')}`}
function v23Train(){const lv=state.v23.libraryLevel||'all',pat=state.v23.libraryPattern||'all',list=EXERCISES.filter(v23Eligible).sort((a,b)=>a.diff-b.diff);return `<div class="topbar"><div><div class="brand">LIBRARY <span>V3.0</span></div><div class="kicker">Bộ lọc theo trình độ + dụng cụ thật</div></div><span class="pill">${list.length} bài</span></div><main><div class="hero"><h1>Bài phù hợp với bạn.</h1><p>ForgePath lọc đồng thời theo trình độ, nhóm vận động và dụng cụ bạn đã khai báo.</p></div><div class="v23-tabs">${[['all','Tất cả'],['beginner','Cơ bản'],['intermediate','Trung cấp'],['advanced','Nâng cao'],['elite','Elite']].map(x=>`<button class="v23-tab ${lv===x[0]?'active':''}" onclick="v23SetFilter('libraryLevel','${x[0]}')">${x[1]}</button>`).join('')}</div><div class="v23-filter">${[['all','Tất cả'],['push','Push'],['pull','Pull'],['legs','Legs'],['core','Core']].map(x=>`<button class="${pat===x[0]?'on':''}" onclick="v23SetFilter('libraryPattern','${x[0]}')">${x[1]}</button>`).join('')}</div><div class="card">${list.length?list.map(e=>{const target=state.profile.levels[e.pattern]||2,fit=Math.abs(e.diff-target)<=.65;return `<div class="v23-ex" onclick="v24OpenExercise('${e.id}')" style="cursor:pointer"><div class="exicon">${e.icon}</div><div><b>${e.name}</b><small>${e.muscle} • ${v23LevelName(e.diff)}</small></div><span class="v23-level ${fit?'fit':e.diff>target+.65?'hard':''}">${fit?'Phù hợp':e.diff>target?'Khó hơn':'Dễ hơn'}</span></div>`}).join(''):'<div class="empty">Không có bài phù hợp với bộ lọc và dụng cụ hiện tại.</div>'}</div></main>${bottomNav('train')}`}

// ==================== V3.0 DATA CORE ====================
const V24_DB='ForgePathDataCore',V24_STORES=['profiles','exercises','sessions','sets','personal_records','calendar','skills','plans','analytics'];let v24db=null,v24Ready=false;
function v24OpenDB(){return new Promise((ok,bad)=>{if(!('indexedDB'in window)){ok(null);return}const r=indexedDB.open(V24_DB,1);r.onupgradeneeded=e=>{const db=e.target.result;V24_STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>{v24db=r.result;v24Ready=true;ok(v24db)};r.onerror=()=>bad(r.error)})}
function v24Put(s,o){if(!v24db)return Promise.resolve(false);return new Promise((ok,bad)=>{const t=v24db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=()=>ok(true);t.onerror=()=>bad(t.error)})}
function v24All(s){if(!v24db)return Promise.resolve([]);return new Promise((ok,bad)=>{const r=v24db.transaction(s,'readonly').objectStore(s).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>bad(r.error)})}
function v24ID(p='id'){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function v24ProgressionFor(id){const C=[['wall_pushup','incline_pushup','knee_pushup','pushup','diamond_pushup','archer_pushup','one_arm_assisted'],['dead_hang','scap_pull','negative_pullup','band_pullup','pullup','chest_to_bar'],['chair_squat','squat','split_squat','bulgarian','assisted_pistol','pistol_squat'],['tuck_lsit','lsit']];for(const c of C){const i=c.indexOf(id);if(i>=0)return{previous:i?c[i-1]:null,next:i<c.length-1?c[i+1]:null,chain:c}}return{previous:null,next:null,chain:[id]}}
function v24Skills(){return[{id:'push',name:'Push-up Mastery',nodes:[['wall_pushup',10],['incline_pushup',12],['knee_pushup',15],['pushup',20],['diamond_pushup',15],['archer_pushup',10],['one_arm_assisted',6]]},{id:'pull',name:'Pull-up Mastery',nodes:[['dead_hang',30],['scap_pull',10],['negative_pullup',5],['band_pullup',8],['pullup',10],['chest_to_bar',6]]},{id:'lsit',name:'L-sit Mastery',nodes:[['tuck_lsit',15],['lsit',10]]},{id:'pistol',name:'Pistol Squat',nodes:[['chair_squat',15],['squat',20],['split_squat',12],['bulgarian',12],['assisted_pistol',8],['pistol_squat',6]]}]}
async function v24Seed(){if(!v24db)return;await v24Put('profiles',{id:'local_user',name:state.profile.name||'Athlete',height:state.v23?.body?.height||170,weight:state.v23?.body?.weight||51,goal:state.profile.goal,equipment:[...state.profile.equipment],days:state.profile.days,minutes:state.profile.minutes,levels:{...state.profile.levels},updatedAt:Date.now()});for(const e of EXERCISES)await v24Put('exercises',{id:e.id,name:e.name,pattern:e.pattern,muscle:e.muscle,difficulty:e.diff,equipment:e.equip||[],target:e.target||'',rest:e.rest||75,progression:v24ProgressionFor(e.id)});for(const s of v24Skills())await v24Put('skills',s)}
async function v24Migrate(){if(!v24db)return;const old=await v24All('sessions');if(old.length)return;for(let i=0;i<state.history.length;i++){const x=state.history[i],sid='legacy_'+i,d=new Date(x.date||Date.now()).toISOString().slice(0,10);await v24Put('sessions',{id:sid,date:x.date||Date.now(),title:x.title||'Workout',completion:x.pct||0,avgRir:x.avgRir??2,durationMin:x.durationMin||state.profile.minutes,exerciseCount:x.exercises||0,source:'V2.3 migration'});await v24Put('calendar',{id:d,date:d,minutes:x.durationMin||state.profile.minutes,completion:x.pct||0,workouts:1})}}
function v24Hist(id){return state.v24?.exerciseHistory?.[id]||[]}
function v24Record(id,reps,rir=2,form=90,hold=0){state.v24=state.v24||{exerciseHistory:{},prs:{}};state.v24.exerciseHistory[id]=state.v24.exerciseHistory[id]||[];const x={date:Date.now(),reps:+reps||0,rir:+rir||0,form:+form||0,holdSec:+hold||0};state.v24.exerciseHistory[id].push(x);state.v24.exerciseHistory[id]=state.v24.exerciseHistory[id].slice(-300);const pr=state.v24.prs[id]||{maxReps:0,maxHold:0};pr.maxReps=Math.max(pr.maxReps,x.reps);pr.maxHold=Math.max(pr.maxHold,x.holdSec);state.v24.prs[id]=pr;save();if(v24db){v24Put('sets',{id:v24ID('set'),sessionId:'manual',exerciseId:id,...x});v24Put('personal_records',{id,exerciseId:id,...pr,updatedAt:Date.now()})}}
function v24Next(e){const H=v24Hist(e.id),x=H[H.length-1];if(!x)return['Bắt đầu',e.target||'Theo giáo án'];const p=v24ProgressionFor(e.id);if(x.form>=88&&x.rir>=2&&x.reps>=15&&p.next)return['Sẵn sàng nâng cấp',(EXERCISES.find(z=>z.id===p.next)||{}).name||p.next];if(x.form<75)return['Củng cố kỹ thuật',Math.max(5,x.reps-2)+' reps'];if(x.rir===0)return['Giữ mức',x.reps+' reps'];return['Tăng tải',(x.reps+1)+'–'+(x.reps+2)+' reps']}

<script id="v241-product-layer">
(()=>{

    const H=hist(id),p=prs(id);
    return {H,p,total:H.reduce((a,x)=>a+(x.reps||0),0),
      avgForm:H.length?Math.round(H.reduce((a,x)=>a+(x.form||0),0)/H.length):0,
      avgRir:H.length?(H.reduce((a,x)=>a+(x.rir||0),0)/H.length).toFixed(1):'—'}
  }
  function rec(e){
    const H=hist(e.id),x=H[H.length-1],c=chain(e.id);
    if(!x)return {label:'BASELINE',text:'Chưa có dữ liệu',cls:''};
    if((x.form||0)<75)return {label:'DELOAD',text:'Giảm tải, ưu tiên form',cls:'hard'};
    if((x.rir??0)===0)return {label:'HOLD',text:'Giữ mức hiện tại',cls:''};
    const good=H.slice(-3).filter(z=>(z.form||0)>=88&&(z.rir??0)>=1).length;
    if(good>=2&&c.next)return {label:'PROGRESS',text:'Sẵn sàng biến thể khó hơn',cls:'good'};
    if((x.rir??0)>=2)return {label:'OVERLOAD',text:'+1–2 reps buổi tới',cls:'good'};
    return {label:'HOLD',text:'Lặp lại và tối ưu form',cls:''};
  }

  function navHTML(active){
    const x=[['home','⌂','Home'],['plan','▦','Plan'],['train','＋','Train'],['progress','↗','Progress'],['profile','●','Profile']];
    return `<nav class="bottomnav">${x.map(a=>`<button class="navbtn ${active===a[0]?'active':''}" onclick="nav('${a[0]}')"><i>${a[1]}</i><span>${a[2]}</span></button>`).join('')}</nav>`;
  }

  function trainPage(){
    const lv=state.v23?.libraryLevel||'all', pat=state.v23?.libraryPattern||'all', q=(state.v243.search||'').trim().toLowerCase();
    let list=EXERCISES.filter(e=>available(e));
    const ranges={beginner:[0,2.2],intermediate:[1.7,3.3],advanced:[2.8,4.3],elite:[3.8,9]};
    if(lv!=='all'){const r=ranges[lv];list=list.filter(e=>e.diff>=r[0]&&e.diff<=r[1])}
    if(pat!=='all')list=list.filter(e=>e.pattern===pat);
    if(q)list=list.filter(e=>(e.name+' '+e.muscle).toLowerCase().includes(q));
    list.sort((a,b)=>a.diff-b.diff);

    return `<div class="topbar"><div><div class="brand">LIBRARY <span>V3.0</span></div><div class="kicker">Exercise intelligence • ${list.length} bài</div></div><span class="pill accent">UI 2.1</span></div><main>
      <div class="hero"><div class="eyebrow">PERSONALIZED LIBRARY</div><h1>Bài tập phù hợp với bạn.</h1><p>Lọc theo trình độ, dụng cụ, nhóm vận động và dữ liệu progression thực tế.</p></div>
      <input class="v243-search" placeholder="Tìm bài, nhóm cơ..." value="${state.v243.search||''}" oninput="state.v243.search=this.value;save();render()">
      <div class="v243-toolbar">${[['all','Tất cả'],['beginner','Cơ bản'],['intermediate','Trung cấp'],['advanced','Nâng cao'],['elite','Elite']].map(x=>`<button class="${lv===x[0]?'on':''}" onclick="v23SetFilter('libraryLevel','${x[0]}')">${x[1]}</button>`).join('')}</div>
      <div class="v243-toolbar" style="margin-top:8px">${[['all','Tất cả'],['push','Push'],['pull','Pull'],['legs','Legs'],['core','Core']].map(x=>`<button class="${pat===x[0]?'on':''}" onclick="v23SetFilter('libraryPattern','${x[0]}')">${x[1]}</button>`).join('')}</div>
      <div class="v243-section"><h3>Exercise database</h3><span class="v243-tag">${list.length} phù hợp</span></div>
      <div class="v243-grid">${list.map(e=>{
        const s=stats(e.id),r=rec(e),target=state.profile.levels?.[e.pattern]||2,fit=Math.abs(e.diff-target)<=.65;
        const prog=s.H.length?Math.min(100,Math.round((s.p.maxReps||s.p.maxHold||0)/20*100)):0;
        return `<div class="v243-excard" onclick="v24OpenExercise('${e.id}')"><div class="v243-exhead"><div class="v243-icon">${e.icon||'•'}</div><div class="v243-exmeta"><b>${e.name}</b><small>${e.muscle} · ${levelName(e.diff)}</small></div><span class="v243-fit ${fit?'good':e.diff>target+.65?'hard':''}">${s.H.length?r.label:(fit?'Phù hợp':e.diff>target?'Khó hơn':'Dễ hơn')}</span></div>
        <div class="v243-progressbar"><i style="width:${prog}%"></i></div><div class="v243-feature-row"><div class="v243-mini"><b>${s.p.maxReps||0}</b><small>PR reps</small></div><div class="v243-mini"><b>${s.avgForm||'—'}${s.avgForm?'%':''}</b><small>Form</small></div><div class="v243-mini"><b>${s.H.length}</b><small>Logs</small></div></div></div>`
      }).join('')||'<div class="empty">Không có bài phù hợp với bộ lọc hiện tại.</div>'}</div>
    </main>${navHTML('train')}`;
  }

  function profilePage(){
    const p=state.profile,b=state.v23?.body||{},weight=b.weight||51,height=b.height||170,bmi=(weight/((height/100)**2)).toFixed(1),xp=state.xp||0,lvl=Math.max(1,Math.floor(xp/500)+1),lp=(xp%500)/5;
    return `<div class="topbar"><div><div class="brand">PROFILE <span>2.0</span></div><div class="kicker">Athlete identity • local-first</div></div><span class="pill accent">🔥 ${state.streak||0}</span></div><main>
      <div class="v243-profile-hero"><div class="v243-profile-head"><div class="v243-avatar">${(p.name||'U')[0].toUpperCase()}</div><div style="flex:1"><b style="font-size:21px">${p.name||'Athlete'}</b><div class="sub">Calisthenics Foundation · Level ${lvl}</div><div class="v243-levelbar"><i style="width:${lp}%"></i></div></div></div>
      <div class="v243-statgrid"><div class="v243-stat"><strong>${weight}</strong><small>KG</small></div><div class="v243-stat"><strong>${height}</strong><small>CM</small></div><div class="v243-stat"><strong>${bmi}</strong><small>BMI</small></div><div class="v243-stat"><strong>${ready()}</strong><small>READINESS</small></div></div>
      <div class="v243-profile-list"><div><span>◎ Mục tiêu chính</span><small>${goalLabel(p.goal)}</small></div><div><span>⌁ Dụng cụ hiện có</span><small>${(p.equipment||[]).map(eqLabel).join(' · ')||'Bodyweight'}</small></div><div><span>▣ Lịch tập</span><small>${p.days} buổi/tuần · ${p.minutes} phút</small></div></div></div>
      <div class="v243-section"><h3>Training Data</h3><span class="v243-tag">Data Core</span></div><div class="v243-statgrid"><div class="v243-stat"><strong>${state.history.length}</strong><small>WORKOUTS</small></div><div class="v243-stat"><strong>${allLogs().length}</strong><small>SETS</small></div><div class="v243-stat"><strong>${Object.keys(state.v24?.prs||{}).length}</strong><small>RECORDS</small></div><div class="v243-stat"><strong>${state.xp||0}</strong><small>XP</small></div></div>
      <div class="card"><b>Cá nhân hóa</b><p class="sub">Dữ liệu Profile, thiết bị, mục tiêu và schedule đang lưu cục bộ. Cloud Sync sẽ là bước V2.5.</p><button class="btn full" onclick="state.onboarded=false;save();render()">Chỉnh hồ sơ & đánh giá lại</button></div>
    </main>${navHTML('profile')}`;
  }

  function calendarHTML(){
    const map={};state.history.forEach(x=>{const d=new Date(x.date),k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();map[k]=(map[k]||0)+(x.durationMin||state.profile.minutes||45)});
    let cells='';for(let i=83;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(),v=map[k]||0,c=v>=60?'d':v>=40?'c':v>=20?'b':v?'a':'';cells+=`<div class="v243-day ${c}" title="${d.toLocaleDateString()} · ${v} phút">${d.getDate()}</div>`}
    return `<div class="card"><div class="v243-cal">${cells}</div><p class="sub">12 tuần gần nhất • ô càng sáng = tập càng nhiều</p></div>`;
  }

  function skillHTML(){
    const defs=typeof v24Skills==='function'?v24Skills():[];
    return defs.map(s=>`<div class="v243-section"><h3>${s.name}</h3><span class="v243-tag">Skill Tree</span></div><div class="card"><div class="v243-skill">${s.nodes.map(([id,req])=>{const e=exBy(id),p=prs(id),v=Math.max(p.maxReps||0,p.maxHold||0),done=v>=req,started=v>0;return `<div class="v243-node ${done?'done':started?'now':'lock'}">${done?'✓':started?Math.min(99,Math.round(v/req*100))+'%':'🔒'}<br>${e?.name||id}<br><small>${v}/${req}</small></div>`}).join('')}</div></div>`).join('')||'<div class="empty">Skill tree chưa có dữ liệu.</div>';
  }

  function progressPage(){
    const tab=state.v243.progressTab||'overview', logs=allLogs(), prList=Object.entries(state.v24?.prs||{}).filter(([,p])=>p.maxReps||p.maxHold);
    let body='';
    if(tab==='overview'){
      const recent=state.history.slice(-16),max=Math.max(1,...recent.map(x=>x.exercises||1));
      body=`<div class="v243-statgrid"><div class="v243-stat"><strong>${state.history.length}</strong><small>WORKOUTS</small></div><div class="v243-stat"><strong>${logs.length}</strong><small>SETS</small></div><div class="v243-stat"><strong>${prList.length}</strong><small>PRS</small></div><div class="v243-stat"><strong>${ready()}</strong><small>READINESS</small></div></div>
      <div class="v243-section"><h3>Volume History</h3><span class="v243-tag">Real data</span></div><div class="card"><div class="v243-chart">${recent.length?recent.map(x=>`<i style="height:${Math.max(8,(x.exercises||1)/max*100)}%" title="${x.title}"></i>`).join(''):'<span class="sub">Chưa có session.</span>'}</div></div>
      <div class="v243-section"><h3>Recent PRs</h3></div><div class="card">${prList.slice(-6).reverse().map(([id,p])=>`<div class="v24-pr"><div><b>${exBy(id)?.name||id}</b><small>${p.maxReps?p.maxReps+' reps':''}${p.maxHold?' · '+p.maxHold+'s':''}</small></div><span>🏆</span></div>`).join('')||'<div class="empty">PR sẽ xuất hiện tự động sau khi bạn phá kỷ lục.</div>'}</div>`;
    } else if(tab==='calendar') body=calendarHTML();
    else if(tab==='exercises'){
      const used=EXERCISES.filter(e=>hist(e.id).length);
      body=`<div class="v243-grid">${used.map(e=>{const s=stats(e.id),r=rec(e);return `<div class="v243-excard" onclick="v24OpenExercise('${e.id}')"><div class="v243-exhead"><div class="v243-icon">${e.icon||'•'}</div><div class="v243-exmeta"><b>${e.name}</b><small>${s.H.length} logs · ${s.total} reps</small></div><span class="v243-fit ${r.cls}">${r.label}</span></div></div>`}).join('')||'<div class="empty">Các bài đã tập sẽ xuất hiện ở đây.</div>'}</div>`;
    } else if(tab==='skills') body=skillHTML();
    else body=`<div class="card">${prList.map(([id,p])=>`<div class="v24-pr"><div><b>${exBy(id)?.name||id}</b><small>${p.maxReps?'Max reps '+p.maxReps:''}${p.maxHold?' · Hold '+p.maxHold+'s':''}</small></div><span>🏆</span></div>`).join('')||'<div class="empty">Chưa có Personal Record.</div>'}</div>`;

    return `<div class="topbar"><div><div class="brand">PROGRESS <span>2.0</span></div><div class="kicker">Volume · Records · Skills · Calendar</div></div><span class="pill accent">${ready()}/100</span></div><main>
      <div class="v243-tabs">${[['overview','Overview'],['calendar','Calendar'],['exercises','Exercises'],['skills','Skill Tree'],['records','Records']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="state.v243.progressTab='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div>${body}
      <div class="v243-section"><h3>Adaptive Engine</h3><span class="v243-tag">Local logic</span></div><div class="v243-ai"><b>Session Data</b><div class="v243-flow"><div>Reps<br><small>Volume</small></div><div>RIR<br><small>Recovery</small></div><div>Form<br><small>Technique</small></div></div><div class="v243-arrow">↓</div><div class="v241-change"><b>Next Workout Generator</b><div class="sub">Reps · Tempo · Rest · Exercise progression</div></div></div>
    </main>${navHTML('progress')}`;
  }

  function detailPage(id){
    const e=exBy(id);if(!e)return trainPage();
    const s=stats(id),r=rec(e),mx=Math.max(1,...s.H.map(x=>x.reps||x.holdSec||1)),c=chain(id);
    return `<div class="topbar"><button class="iconbtn" onclick="state.exerciseDetail=null;state.tab='train';save();render()">‹</button><div><div class="brand">${e.name}</div><div class="kicker">${e.muscle} · Exercise Intelligence</div></div></div><main>
      <div class="v243-detail-hero"><div class="eyebrow">${r.label}</div><h1 style="margin:6px 0">${r.text}</h1><p class="sub">Progression cá nhân từ reps · RIR · form.</p></div>
      <div class="v243-section"><h3>Form Intelligence</h3><span class="v243-tag">Biomechanics</span></div><div class="v243-features">
        <div class="v243-feature"><div>◉</div><b>3D Form Coach</b><small>Mannequin biomechanical</small></div><div class="v243-feature"><div>↔</div><b>ROM chuẩn</b><small>Range of Motion</small></div><div class="v243-feature"><div>◈</div><b>Muscle Heatmap</b><small>${e.muscle}</small></div><div class="v243-feature"><div>!</div><b>Common Mistakes</b><small>Joint alignment · ROM · control</small></div><div class="v243-feature"><div>≈</div><b>Hít thở</b><small>Breathing theo pha</small></div><div class="v243-feature"><div>⏱</div><b>Tempo</b><small>${e.tempo||'2–1–2'}</small></div></div>
      <div class="v243-section"><h3>Performance</h3><span class="v243-tag">${s.H.length} logs</span></div><div class="v243-statgrid"><div class="v243-stat"><strong>${s.p.maxReps||0}</strong><small>PR REPS</small></div><div class="v243-stat"><strong>${s.p.maxHold||0}s</strong><small>PR HOLD</small></div><div class="v243-stat"><strong>${s.avgForm||'—'}${s.avgForm?'%':''}</strong><small>FORM</small></div><div class="v243-stat"><strong>${s.avgRir}</strong><small>RIR</small></div></div>
      <div class="card"><b>Volume / reps history</b><div class="v243-chart">${s.H.length?s.H.slice(-20).map(x=>`<i style="height:${Math.max(6,(x.reps||x.holdSec||0)/mx*100)}%"></i>`).join(''):'<span class="sub">Chưa có dữ liệu thật.</span>'}</div></div>
      <div class="v243-section"><h3>Progression Chain</h3></div><div class="card"><div class="v243-skill">${c.chain.map(x=>{const ex=exBy(x),p=prs(x),v=Math.max(p.maxReps||0,p.maxHold||0);return `<div class="v243-node ${v?'done':x===id?'now':'lock'}">${v?'✓':x===id?'●':'🔒'}<br>${ex?.name||x}</div>`}).join('')}</div></div>
    </main>`;
  }

  function appRender(){
    try{
      if(state.exerciseDetail){document.querySelector('#app').innerHTML=detailPage(state.exerciseDetail);return}
      if(state.currentWorkout){renderWorkout();return}
      if(!state.onboarded){onboarding();return}
      const pages={home:window.home||home,plan:window.plan||plan,train:trainPage,progress:progressPage,profile:profilePage};
      const fn=pages[state.tab]||pages.home;
      document.querySelector('#app').innerHTML=fn();
    }catch(err){
      console.error('ForgePath V3.0 render',err);
      document.querySelector('#app').innerHTML=`<main><div class="card"><h2>⚠ UI runtime error</h2><p class="sub">${String(err.message||err)}</p><button class="btn primary" onclick="state.tab='home';state.exerciseDetail=null;save();location.reload()">Khôi phục Home</button></div></main>`;
    }
  }

  window.nav=function(tab){state.tab=tab;state.exerciseDetail=null;save();appRender();window.scrollTo(0,0)};
  window.v24OpenExercise=function(id){state.exerciseDetail=id;save();appRender()};
  window.bottomNav=navHTML;
  window.v23Train=trainPage;
  window.v23Progress=progressPage;
  window.profile=profilePage;
  window.v24ExercisePage=detailPage;
  window.render=appRender;
  try{render=appRender;v23Train=trainPage;v23Progress=progressPage;profile=profilePage;v24ExercisePage=detailPage}catch(_){}
  appRender();
})();
</script>

  const userReady=()=> typeof v23Readiness==='function' ? v23Readiness() : 72;
  const progression=id=> typeof v24ProgressionFor==='function' ? v24ProgressionFor(id) : {previous:null,next:null,chain:[id]};
  const profileTypeLabel = ()=> t(state.v30.trainingProfile==='balanced'?'balanced':state.v30.trainingProfile==='strength'?'strength':state.v30.trainingProfile==='hypertrophy'?'hypertrophy':state.v30.trainingProfile==='endurance'?'endurance':'skills2');

  function navHTML(active){

  function cardUser(){
    const p=state.profile||{}, body=state.v23?.body||{}, weight=body.weight||51, height=body.height||170, bmi=(weight/((height/100)**2)).toFixed(1), xp=state.xp||0, level=Math.max(1,Math.floor(xp/500)+1), levelP=((xp%500)/5);
    return `<div class="v30-panel v30-user">
      <div class="v30-userhead">
        <div class="v30-avatar">${(p.name||'U')[0].toUpperCase()}</div>
        <div style="flex:1">
          <div class="v30-tag">${t('profile2')}</div>

  function recommendation(ex){
    const H=hist(ex.id),x=H[H.length-1],pr=progression(ex.id);
    if(!x)return {label:'BASELINE',text:state.v30.lang==='en'?'Start logging this movement':'Bắt đầu log bài này',cls:''};
    if((x.form||0)<75)return {label:'DELOAD',text:state.v30.lang==='en'?'Reduce reps, prioritize form':'Giảm reps, ưu tiên form',cls:'bad'};
    if((x.rir??0)===0)return {label:'HOLD',text:state.v30.lang==='en'?'Stay at current load':'Giữ mức hiện tại',cls:'warn'};
    const good=H.slice(-3).filter(z=>(z.form||0)>=88&&(z.rir??0)>=1).length;
    if(good>=2 && pr.next)return {label:'PROGRESS',text:state.v30.lang==='en'?'Ready for harder variation':'Sẵn sàng lên biến thể khó hơn',cls:'good'};
    if((x.rir??0)>=2)return {label:'OVERLOAD',text:state.v30.lang==='en'?'+1–2 reps next workout':'+1–2 reps buổi tới',cls:'good'};
    return {label:'HOLD',text:state.v30.lang==='en'?'Repeat and refine technique':'Lặp lại và tối ưu kỹ thuật',cls:''};
  }

        return `<div class="v31-row"><span><b>${ex.name||id}</b></span><small>${v.maxReps?('Max reps '+v.maxReps):''}${v.maxHold?(' · Hold '+v.maxHold+'s'):''}</small></div>`;

    } else if(view==='calendar'){
      const map={}; (state.history||[]).forEach(x=>{ const d=new Date(x.date), k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); map[k]=(map[k]||0)+(x.durationMin||45); });
      let cells=''; for(let i=83;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); const v=map[k]||0; const c=v>=60?'d':v>=40?'c':v>=20?'b':v?'a':''; cells += `<div class="v30-day ${c}" title="${d.toLocaleDateString()} · ${v}m">${d.getDate()}</div>`; }
      content = `<div class="card"><div class="row between"><h3>Calendar</h3><button class="v31-settingsIcon" onclick="state.v31.progressView='settings';save();render()">⚙</button></div><div class="v30-calendar" style="margin-top:12px">${cells}</div></div>`;
    } else {
      content = `<div class="card">
        <div class="row between"><h3>Settings</h3><button class="v31-settingsIcon" onclick="state.v31.progressView='overview';save();render()">↩</button></div>
        <div class="v31-list">
          <div><div class="kicker">Theme</div><div class="v31-swatches" style="margin-top:10px">
            ${['neon','ocean','sunset','mono'].map(k=>`<div class="v31-swatch ${k} ${state.v30.theme===k?'on':''}" onclick="state.v30.theme='${k}';saveAndRender('Saved')"></div>`).join('')}
          </div></div>
          <div><div class="kicker">Training Profile</div><div class="v31-optionBar" style="margin-top:10px">
            ${[['balanced','Balanced'],['strength','Strength'],['hypertrophy','Hypertrophy'],['endurance','Endurance'],['skills','Skills']].map(x=>`<div class="v31-option ${state.v30.trainingProfile===x[0]?'on':''}" onclick="state.v30.trainingProfile='${x[0]}';saveAndRender('Saved')">${x[1]}</div>`).join('')}
          </div></div>
          <div><div class="kicker">Language</div><div class="v31-optionBar" style="margin-top:10px">
            ${[['vi','Tiếng Việt'],['en','English']].map(x=>`<div class="v31-option ${state.v30.lang===x[0]?'on':''}" onclick="state.v30.lang='${x[0]}';saveAndRender('Saved')">${x[1]}</div>`).join('')}
          </div></div>
          <div class="v31-row"><span>Compact UI</span><button class="btn ${state.v30.compactMode?'primary':'ghost'}" onclick="state.v30.compactMode=!state.v30.compactMode;saveAndRender('Saved')">${state.v30.compactMode?'ON':'OFF'}</button></div>
          <div class="v31-row"><span>Animations</span><button class="btn ${state.v30.animations?'primary':'ghost'}" onclick="state.v30.animations=!state.v30.animations;saveAndRender('Saved')">${state.v30.animations?'ON':'OFF'}</button></div>
          <div class="v31-row"><span>Re-open onboarding</span><button class="btn ghost" onclick="state.onboarded=false;save();render()">Start setup</button></div>
        </div>
      </div>`;
    }
    return `<div class="topbar"><div class="row between"><div><div class="brand">My Progress <span>V3.6</span></div><div class="kicker">Profile + heatmap + settings trong cùng 1 mục</div></div><button class="v31-settingsIcon" onclick="state.v31.progressView='settings';save();render()">⚙</button></div></div>
      <main class="v30-shell">
        <div class="v31-subtabs">
          <button class="${view==='overview'?'on':''}" onclick="state.v31.progressView='overview';save();render()">Overview</button>
          <button class="${view==='records'?'on':''}" onclick="state.v31.progressView='records';save();render()">Records</button>
          <button class="${view==='calendar'?'on':''}" onclick="state.v31.progressView='calendar';save();render()">Calendar</button>
          <button class="${view==='settings'?'on':''}" onclick="state.v31.progressView='settings';save();render()">Settings</button>
        </div>
        ${content}
      </main>${bottomNavV31('progress')}`;
  }
  function bottomNavV31(active){
    const items=[['home','⌂','Home'],['plan','▦','Plan'],['train','＋','Train'],['progress','↗','Progress']];
    return `<nav class="bottomnav">${items.map(i=>`<button class="navbtn ${active===i[0]?'active':''}" onclick="nav('${i[0]}')"><i>${i[1]}</i><span>${i[2]}</span></button>`).join('')}</nav>`;
  }
  function trainPageV31(){
    if(typeof oldTrainPage==='function'){
      const html = oldTrainPage();
      return String(html).replace('V3.0','V3.1').replace('</main>', `<div class="card" style="margin-top:14px"><b>Expanded library</b><div class="sub">Hiện đã có khoảng ${countExercises()} bài tập, đa dạng hơn nhiều so với bản cũ.</div></div></main>`);
    }
    return `<main><div class="card"><h2>Train</h2><p class="sub">${countExercises()} exercises available.</p></div></main>`;
  }
  function appRenderV31(){
    try{
      if(state.exerciseDetail && typeof oldExercisePage==='function'){
        document.querySelector('#app').innerHTML = oldExercisePage(state.exerciseDetail);
        return;
      }
      if(state.currentWorkout && typeof oldRenderWorkout==='function'){
        oldRenderWorkout(); return;
      }
      if(!state.onboarded){ onboarding(); return; }
      const pages={home:homePageV31, plan:(typeof oldCoachPage==='function'?oldCoachPage:homePageV31), train:trainPageV31, progress:progressPageV31};
      const fn = pages[state.tab] || homePageV31;
      document.querySelector('#app').innerHTML = fn();
    } catch(err){
      console.error('V3.1 render error', err);
      document.querySelector('#app').innerHTML = `<main><div class="card"><h2>⚠ V3.4 runtime error</h2><p class="sub">${String(err.message||err)}</p></div></main>`;
    }
  }
  window.bottomNav = bottomNavV31;
  window.nav = function(tab){ state.tab=tab; state.exerciseDetail=null; save(); appRenderV31(); window.scrollTo(0,0); };
  window.home = homePageV31;
  window.v23Train = trainPageV31;
  window.v23Progress = progressPageV31;
  window.profile = progressPageV31;
  window.render = appRenderV31;
  appRenderV31();
})();
</script>


<script id="v311-ui-fix">
(()=>{
  /* Normalize household equipment introduced in V3.1 so exercises do not become
     impossible to discover just because "wall/towel/bench" were not onboarding options. */
  try{
    EXERCISES.forEach(ex=>{
      if(!Array.isArray(ex.eq)) ex.eq=[];
      ex.eq=ex.eq.map(x=>x==='bench'?'chair':x).filter(x=>x!=='wall'&&x!=='towel');
    });
  }catch(_){}

  // Keep the Settings destination inside Progress only.
  state.v31=Object.assign({progressView:'overview'},state.v31||{});

  const previousRender = window.render;
  const previousNav = window.nav;

  function v311BottomNav(active){
    const items=[
      ['home','⌂','Home'],
      ['plan','▦','Coach'],
      ['train','＋','Train'],
      ['progress','↗','Progress']
    ];
    return `<nav class="bottomnav">${items.map(([key,icon,label])=>`
      <button class="navbtn ${active===key?'active':''}" onclick="nav('${key}')">
        <i>${icon}</i><span>${label}</span>
      </button>`).join('')}</nav>`;
  }

  // Rebuild Train instead of wrapping the legacy V3.0 page.
  function trainStable(){
    const lv=state.v23?.libraryLevel||'all';
    const pat=state.v23?.libraryPattern||'all';
    const q=(state.v30Search||'').trim().toLowerCase();
    const ranges={beginner:[0,2.2],intermediate:[1.7,3.3],advanced:[2.8,4.3],elite:[3.8,9]};
    let list=EXERCISES.filter(e=>available(e));
    const compatibleCount=list.length;
    if(lv!=='all'){
      const r=ranges[lv]||[0,9];
      list=list.filter(e=>e.diff>=r[0]&&e.diff<=r[1]);
    }
    if(pat!=='all') list=list.filter(e=>e.pattern===pat);
    if(q) list=list.filter(e=>(`${e.name} ${e.muscle} ${e.pattern}`).toLowerCase().includes(q));
    list.sort((a,b)=>a.diff-b.diff);

    const card=e=>{
      const arr=state.v24?.exerciseHistory?.[e.id]||[];
      const pr=state.v24?.prs?.[e.id]||{};
      const avg=arr.length?Math.round(arr.reduce((a,x)=>a+(x.form||0),0)/arr.length):0;
      const target=state.profile.levels?.[e.pattern]||2;
      const delta=e.diff-target;
      const fit=arr.length?'Tracked':delta>.9?'Khó hơn':delta>.3?'Thử thách':'Phù hợp';
      const cls=arr.length?'good':delta>.9?'bad':delta>.3?'warn':'good';
      return `<div class="v30-excard" onclick="v24OpenExercise('${e.id}')">
        <div class="v30-exhead">
          <div class="v30-icon">${e.icon||'•'}</div>
          <div class="v30-exmeta"><b>${e.name}</b><small>${e.muscle} · ${typeof v23LevelName==='function'?v23LevelName(e.diff):'Level '+e.diff}</small></div>
          <span class="v30-fit ${cls}">${fit}</span>
        </div>
        <div class="v30-meter"><i style="width:${arr.length?Math.min(100,Math.max(10,(pr.maxReps||pr.maxHold||0)*5)):8}%"></i></div>
        <div class="v30-minirow">
          <div class="v30-mini"><b>${pr.maxReps||0}</b><span>PR</span></div>
          <div class="v30-mini"><b>${avg||'—'}${avg?'%':''}</b><span>FORM</span></div>
          <div class="v30-mini"><b>${arr.length}</b><span>LOGS</span></div>
        </div>
      </div>`;
    };

    return `<div class="topbar">
      <div><div class="brand">TRAIN <span>V3.6</span></div><div class="kicker">Expanded Exercise Library</div></div>
      <span class="pill accent">${compatibleCount}/${EXERCISES.length} phù hợp</span>
    </div>
    <main class="v30-shell">
      <div class="hero">
        <div class="eyebrow">SMART LIBRARY</div>
        <h1>${EXERCISES.length} động tác.</h1>
        <p>Hiển thị rõ bài phù hợp với dụng cụ, trình độ và lịch sử tập luyện của bạn.</p>
      </div>
      <input class="v30-search" placeholder="Tìm bài tập hoặc nhóm cơ..." value="${state.v30Search||''}"
        oninput="state.v30Search=this.value;save();render()">
      <div class="v30-chips">
        ${[['all','Tất cả'],['beginner','Cơ bản'],['intermediate','Trung cấp'],['advanced','Nâng cao'],['elite','Elite']]
          .map(([k,l])=>`<button class="${lv===k?'on':''}" onclick="v23SetFilter('libraryLevel','${k}')">${l}</button>`).join('')}
      </div>
      <div class="v30-chips">
        ${[['all','Tất cả'],['push','Push'],['pull','Pull'],['legs','Legs'],['core','Core']]
          .map(([k,l])=>`<button class="${pat===k?'on':''}" onclick="v23SetFilter('libraryPattern','${k}')">${l}</button>`).join('')}
      </div>
      <div class="v30-cardgrid">${list.map(card).join('')||'<div class="empty">Không có bài phù hợp với bộ lọc hiện tại.</div>'}</div>
    </main>${v311BottomNav('train')}`;
  }

  // Coach gets the same 4-item navigation and no separate Settings/Profile destination.
  function coachStable(){
    const p=state.profile||{};
    return `<div class="topbar">
      <div><div class="brand">COACH <span>V3.4</span></div><div class="kicker">${state.v30?.trainingProfile||'balanced'} · Tuần ${state.week}</div></div>
      <span class="pill accent">${p.days||4} buổi</span>
    </div>
    <main class="v30-shell">
      <div class="hero"><div class="eyebrow">ADAPTIVE PLAN</div><h1>Giáo án tuần của bạn.</h1>
        <p>Giữ nguyên hướng UI V3.1 nhưng gom thông tin cần thiết, tránh card bị tràn và navigation không đồng nhất.</p></div>
      <div class="v30-planlist">
        ${state.plan.map((w,i)=>`<div class="v30-plan">
          <div class="v30-planhead">
            <div style="display:flex;gap:10px;min-width:0">
              <div class="v30-check">${w.completed?'✓':i+1}</div>
              <div style="min-width:0"><b>${w.title}</b><div class="sub">${w.focus} · ${w.exercises.length} bài</div></div>
            </div>
            <span class="v30-fit ${w.completed?'good':''}">${w.completed?'Done':'Ready'}</span>
          </div>
          <div class="v30-exlist">${w.exercises.slice(0,6).map(e=>`<span class="v30-expill">${e.name}</span>`).join('')}</div>
          <button class="btn ${w.completed?'ghost':'primary'} full" style="margin-top:12px" onclick="startWorkout('${w.id}')">
            ${w.completed?'Xem lại':'Bắt đầu'}
          </button>
        </div>`).join('')}
      </div>
    </main>${v311BottomNav('plan')}`;
  }

  // Remove duplicated Settings tab. The gear in the Progress header is the single Settings entry.
  function cleanProgressHTML(html){
    if(typeof html!=='string') return html;
    html=html.replace(
      /<button class="[^"]*" onclick="state\.v31\.progressView='settings';save\(\);render\(\)">Settings<\/button>/g,
      ''
    );
    html=html.replace(/My Progress <span>V3\.1<\/span>/g,'My Progress <span>V3.6</span>');
    return html;
  }

  const progressOriginal = window.v23Progress;
  function progressStable(){
    const before=state.v31.progressView;
    const html=typeof progressOriginal==='function'?progressOriginal():'';
    state.v31.progressView=before;
    return cleanProgressHTML(html);
  }

  function stableRender(){
    try{
      if(state.exerciseDetail){
        const fn=window.v24ExercisePage;
        document.querySelector('#app').innerHTML=typeof fn==='function'?fn(state.exerciseDetail):'';
        return;
      }
      if(state.currentWorkout){
        renderWorkout(); return;
      }
      if(!state.onboarded){onboarding();return}
      let html='';
      if(state.tab==='home') html=typeof window.home==='function'?window.home():'';
      else if(state.tab==='plan') html=coachStable();
      else if(state.tab==='train') html=trainStable();
      else if(state.tab==='progress'||state.tab==='settings'||state.tab==='profile') {
        state.tab='progress';
        html=progressStable();
      } else {
        state.tab='home';
        html=typeof window.home==='function'?window.home():'';
      }
      document.querySelector('#app').innerHTML=html;
    }catch(err){
      console.error('ForgePath V3.4 UI',err);
      document.querySelector('#app').innerHTML=`<main><div class="card"><h2>⚠ UI error</h2>
        <p class="sub">${String(err.message||err)}</p>
        <button class="btn primary" onclick="state.tab='home';state.exerciseDetail=null;save();location.reload()">Khôi phục Home</button></div></main>`;
    }
  }

  window.bottomNav=v311BottomNav;
  window.v23Train=trainStable;
  window.nav=function(tab){
    if(tab==='settings'||tab==='profile'){state.tab='progress';state.v31.progressView='settings'}
    else state.tab=tab;
    state.exerciseDetail=null;save();stableRender();window.scrollTo(0,0);
  };
  window.render=stableRender;
  try{bottomNav=v311BottomNav;v23Train=trainStable;render=stableRender}catch(_){}
  stableRender();
})();
</script>

  function genericGuide(ex){
    return {
      setup:`Chuẩn bị tư thế ổn định cho ${ex.name}, siết core và dùng biên độ không gây đau.`,
      steps:[
        `Vào tư thế bắt đầu của ${ex.name} và tạo độ căng ở ${ex.muscle}.`,
        ex.type==='time'?'Giữ tư thế trong thời gian mục tiêu với kỹ thuật ổn định.':'Thực hiện rep có kiểm soát, ROM đầy đủ.',
        'Dừng set khi kỹ thuật bắt đầu vỡ; ưu tiên chất lượng hơn số lượng.'
      ],
      cues:['Core ổn định','Kiểm soát nhịp','Không ép ROM qua đau'],
      mistakes:['Dùng đà quá nhiều','Mất cột sống trung lập','Cố thêm rep khi form đã vỡ'],
      breathing:ex.type==='time'?'Thở đều trong toàn bộ hold.':'Hít ở pha hạ/chuẩn bị, thở ra ở pha dùng lực.'
    };
  }

  const inserted=[];
  V32_EXTRAS.forEach(ex=>{
    if(!EXERCISES.some(e=>e.id===ex.id)){
      EXERCISES.push(ex); inserted.push(ex);
      if(typeof GUIDES!=='undefined'&&!GUIDES[ex.id]) GUIDES[ex.id]=genericGuide(ex);
    }
  });

  // Persist newly expanded exercise metadata to Data Core as well.
  try{
    if(typeof v24db!=='undefined'&&v24db&&typeof v24Put==='function'){
      inserted.forEach(ex=>v24Put('exercises',{
        id:ex.id,name:ex.name,pattern:ex.pattern,muscle:ex.muscle,difficulty:ex.diff,
        equipment:ex.eq||[],target:(ex.rep||[]).join('–'),rest:ex.diff>=4?100:75,
        progression:typeof v24ProgressionFor==='function'?v24ProgressionFor(ex.id):{previous:null,next:null,chain:[ex.id]}
      }));
    }
  }catch(_e){}

  function trainTabs(mode){
    return `<div class="v32-train-tabs">
      <button class="${mode==='exercises'?'on':''}" onclick="state.v32.trainMode='exercises';state.v32.skillId=null;save();render()">🏋 Bài tập <small>(${EXERCISES.length})</small></button>
      <button class="${mode==='skills'?'on':''}" onclick="state.v32.trainMode='skills';state.v32.skillId=null;save();render()">⚡ Skills <small>(${V32_SKILLS.length})</small></button>
    </div>`;
  }

  function prFor(id){
    const p=state.v24?.prs?.[id]||{};
    return {reps:+(p.maxReps||0),hold:+(p.maxHold||0)};
  }
  function assessmentFallback(id,metric){
    const a=state.assessment||{};
    if(id==='pushup'&&metric==='reps')return +(a.pushup||0);
    if((id==='pullup'||id==='chinup')&&metric==='reps')return +(a.pullup||0);
    if(id==='squat'&&metric==='reps')return +(a.squat||0);
    if(id==='plank'&&metric==='hold')return +(a.plank||0);
    return 0;
  }
  function reqValue(req){
    const p=prFor(req[0]);
    const v=req[1]==='hold'?p.hold:p.reps;
    return Math.max(v,assessmentFallback(req[0],req[1]));
  }
  function reqDone(req){return reqValue(req)>=req[2]}
  function readiness(skill){
    if(!skill.requirements.length)return 0;
    const sum=skill.requirements.reduce((a,r)=>a+Math.min(1,reqValue(r)/Math.max(1,r[2])),0);
    return Math.round(sum/skill.requirements.length*100);
  }
  function missingEq(skill){
    const have=state.profile.equipment||[];
    return (skill.equipment||[]).filter(e=>!have.includes(e));
  }
  function skillState(skill){
    const score=readiness(skill);
    return score>=100?{text:'READY',cls:'good'}:score>=55?{text:'BUILDING',cls:'mid'}:{text:'FOUNDATION',cls:''};
  }

  function skillsPage(){
    const filter=state.v32.skillFilter||'all';
    let list=V32_SKILLS;
    if(filter!=='all')list=list.filter(s=>s.level===filter);
    return `<div class="topbar"><div><div class="brand">TRAIN <span>V3.5.1</span></div><div class="kicker">Exercise Library + Skill Training</div></div><span class="pill accent">${EXERCISES.length} bài</span></div>
    <main class="v30-shell">
      ${trainTabs('skills')}
      <div class="hero"><div class="eyebrow">CALISTHENICS SKILLS</div><h1>Học skill theo lộ trình.</h1><p>Mỗi skill có điều kiện sức mạnh, bài bổ trợ, mức sẵn sàng và buổi luyện riêng.</p></div>
      <div class="v30-chips">
        ${[['all','Tất cả'],['Intermediate','Intermediate'],['Advanced','Advanced'],['Elite','Elite']].map(([k,l])=>`<button class="${filter===k?'on':''}" onclick="state.v32.skillFilter='${k}';save();render()">${l}</button>`).join('')}

        ${list.map(skill=>{
          const score=readiness(skill),st=skillState(skill),missing=missingEq(skill);
          return `<div class="v32-skillcard" onclick="state.v32.skillId='${skill.id}';save();render()">
            <div class="v32-skillhead"><div class="v32-skillicon">${skill.icon}</div><div class="v32-skillmeta"><b>${skill.name}</b><small>${skill.level} · ${skill.weeks}</small></div><span class="v32-ready ${st.cls}">${score}%</span></div>
            <div class="v32-progress"><i style="width:${score}%"></i></div>
            <p class="sub" style="margin:0 0 10px">${skill.desc}</p>
            <div class="v32-reqpreview">${skill.requirements.slice(0,4).map(r=>`<span class="${reqDone(r)?'done':''}">${reqDone(r)?'✓':'○'} ${r[3]}</span>`).join('')}</div>
            ${missing.length?`<div class="v32-lock" style="margin-top:10px">Cần: ${missing.map(eqLabel).join(' · ')}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </main>${typeof bottomNav==='function'?bottomNav('train'):''}`;
  }

  function exercisesPage(){
    let html=typeof previousTrain==='function'?previousTrain():'';
    html=String(html).replace(/V3\.1(?:\.1)?/g,'V3.4');
    const marker='<main class="v30-shell">';
    if(html.includes(marker))html=html.replace(marker,marker+trainTabs('exercises'));
    else if(html.includes('<main>'))html=html.replace('<main>','<main>'+trainTabs('exercises'));
    return html;
  }

      const ex=EXERCISES.find(e=>e.id===r[0]),v=reqValue(r),done=reqDone(r),unit=r[1]==='hold'?'s':' reps';
      const pct=Math.min(100,Math.round(v/Math.max(1,r[2])*100));
      return `<div class="v32-reqrow">
        <div class="v32-reqstate ${done?'done':''}">${done?'✓':'○'}</div>
        <div><b>${r[3]}</b><div class="sub">${ex?.name||r[0]} · hiện tại ${v}${unit}</div><div class="v32-progress" style="margin:6px 0 0"><i style="width:${pct}%"></i></div></div>
        <span class="v32-ready ${done?'good':''}">${pct}%</span>

    }).join('');
    const drills=skill.drills.map(id=>EXERCISES.find(e=>e.id===id)).filter(Boolean);
    return `<div class="topbar"><button class="iconbtn" onclick="state.v32.skillId=null;save();render()">‹</button><div><div class="brand">${skill.icon} ${skill.name}</div><div class="kicker">${skill.level} · Skill Path</div></div><span class="pill accent">${score}%</span></div>

        <p>${skill.desc}</p>

  window.v32StartSkill=function(id){
    const skill=V32_SKILLS.find(s=>s.id===id);if(!skill)return;
    const need=skill.requirements.filter(r=>!reqDone(r)).map(r=>r[0]);
    const ids=[...new Set([...need,...skill.drills])];
    const selected=ids.map(id=>EXERCISES.find(e=>e.id===id)).filter(Boolean).filter(e=>available(e)).slice(0,5);
    if(!selected.length){toast('Chưa có drill phù hợp với dụng cụ hiện tại');return}
    const pid='skill_'+skill.id+'_'+Date.now();
    const workout={
      id:pid,title:'Skill • '+skill.name,focus:'Skill Training · '+scoreText(readiness(skill)),

  };
  function scoreText(x){return x>=100?'Ready':x>=55?'Building':'Foundation'}

  function trainHub(){
    if(state.v32.skillId){

  window.v23Train=trainHub;

})();
</script>

<script id="v33-real3d-engine">
(()=>{
  state.v33=Object.assign({quality:'auto',idle:true,profileRange:'all'},state.v33||{});
  const BASE_RENDER=window.render;
  const BASE_NAV=window.nav;
  const BASE_DETAIL=window.v24ExercisePage;
  const V33={instances:new Map(),threePromise:null};

  function ensureThree(){
    if(window.THREE)return Promise.resolve(window.THREE);
    if(V33.threePromise)return V33.threePromise;
    V33.threePromise=new Promise((resolve,reject)=>{
      const urls=[
        'https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js',
        'https://unpkg.com/three@0.146.0/build/three.min.js'

  function mappedMotion(id){

    if(/pullup|pull-up|chinup|chin-up|muscle.?up|hang|front lever|back lever|skin the cat|german/.test(n))return 'pullup';
    if(/row|face pull|pulldown|pull-apart|y raise|w raise/.test(n))return 'band_row';
    if(/curl/.test(n))return 'band_facepull';
    if(/squat|pistol|wall sit/.test(n))return /pistol/.test(n)?'assisted_pistol':'squat';
    if(/lunge|split|step-up|step up|skater/.test(n))return 'split_squat';
    if(/rdl|deadlift|good morning|hinge/.test(n))return 'db_rdl';
    if(/bridge|hip thrust|frog pump|leg curl|hamstring/.test(n))return 'glute_bridge';
    if(/calf|tibialis|pogo/.test(n))return 'calf_raise';
    if(/hanging|toes.?to.?bar|windshield/.test(n))return 'hanging_knee';
    if(/l.?sit|v.?sit|compression/.test(n))return 'lsit';
    if(/plank|bear crawl|body saw|pallof|suitcase/.test(n))return 'plank';
    if(/leg raise|dragon flag|reverse crunch|v-up|vup|jackknife|crunch|sit-up|situp|flutter|scissor/.test(n))return 'leg_raise';
    if(/hollow/.test(n))return 'hollow';
    if(/dead bug|bird dog/.test(n))return 'deadbug';
    return e.pattern==='pull'?'band_row':e.pattern==='legs'?'squat':e.pattern==='core'?'plank':'pushup';
  }

  function motionFor(id){
    const mapped=mappedMotion(id);
    try{return fpMotionFor(mapped)}catch(_){return fpMotionFor('squat')}
  }
  const cp=p=>JSON.parse(JSON.stringify(p));
  function lerpPose(a,b,t){const o={};for(const k in a)o[k]=a[k].map((v,i)=>v+(b[k][i]-v)*t);return o}
  function sampleMotion(motion,now,start,speed,pausedAt){
    if(motion.hold)return {p:cp(motion.frames[0]),phase:(motion.phases&&motion.phases[0])||'Hold'};
    const c=(((pausedAt??now)-start)/1000)*speed;
    const frames=motion.frames;
    if(frames.length===2){const u=c%2,fw=u<1,t=fw?u:2-u,e=.5-.5*Math.cos(Math.PI*t);return {p:lerpPose(frames[0],frames[1],e),phase:fw?'Pha chính':'Trở về'}}

    return {p:lerpPose(frames[s],frames[n],e),phase:(motion.phases&&motion.phases[s])||'Chuyển động'};
  }

  function setupRenderer(host){
    const THREE=window.THREE;
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0b1217);
    const camera=new THREE.PerspectiveCamera(34,1,.1,50);
    const quality=state.v33.quality;
    const low=(quality==='low')||(quality==='auto'&&((navigator.hardwareConcurrency||8)<=4));
    const renderer=new THREE.WebGLRenderer({antialias:!low,alpha:false,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,low?1:1.5));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.shadowMap.enabled=!low;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    host.innerHTML='';host.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xdff5ff,0x101319,1.7));
    const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(3.5,5,4);key.castShadow=!low;scene.add(key);
    const rim=new THREE.DirectionalLight(0x67d8ff,1.0);rim.position.set(-4,2.5,-3);scene.add(rim);
    const fill=new THREE.PointLight(0xb5ff43,.4,7);fill.position.set(0,2.2,2.5);scene.add(fill);
    const floor=new THREE.Mesh(new THREE.CircleGeometry(3.4,48),new THREE.MeshStandardMaterial({color:0x11191e,roughness:1}));
    floor.rotation.x=-Math.PI/2;floor.position.y=.005;floor.receiveShadow=true;scene.add(floor);
    const grid=new THREE.GridHelper(5.6,14,0x33434d,0x1b252c);grid.position.y=.012;scene.add(grid);
    return {THREE,scene,camera,renderer,low};
  }

  function between(mesh,a,b,baseRadius=1){
    const THREE=window.THREE,A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(B,A),len=Math.max(.001,d.length());
    mesh.position.copy(A).add(B).multiplyScalar(.5);
    mesh.scale.set(baseRadius,len,baseRadius);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  }

  function makeAthleticHuman(scene,mode='exercise'){
    const THREE=window.THREE;
    const skin=new THREE.MeshPhysicalMaterial({color:0xd7b79d,roughness:.72,metalness:0,clearcoat:.05});
    const top=new THREE.MeshStandardMaterial({color:0x30383d,roughness:.82,metalness:.02});
    const shorts=new THREE.MeshStandardMaterial({color:0x171d21,roughness:.85});
    const shoe=new THREE.MeshStandardMaterial({color:0x76838a,roughness:.75});
    const hot=new THREE.MeshStandardMaterial({color:0xff4f66,roughness:.55,transparent:true,opacity:.7,emissive:0x5a0d18,emissiveIntensity:.75});
    const backHot=new THREE.MeshStandardMaterial({color:0x47c8ff,roughness:.55,transparent:true,opacity:.65,emissive:0x0b3555,emissiveIntensity:.7});
    const legHot=new THREE.MeshStandardMaterial({color:0x78ff78,roughness:.55,transparent:true,opacity:.62,emissive:0x164d16,emissiveIntensity:.6});
    const coreHot=new THREE.MeshStandardMaterial({color:0xffbd4a,roughness:.55,transparent:true,opacity:.62,emissive:0x513207,emissiveIntensity:.55});
    const root=new THREE.Group();scene.add(root);const P={};
    const cyl=(name,r,mat)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.86,r,1,14),mat);m.castShadow=true;m.receiveShadow=true;root.add(m);P[name]=m;return m};
    const sph=(name,r,mat,scale=[1,1,1])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,22,16),mat);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;root.add(m);P[name]=m;return m};
    P.head=sph('head',.15,skin,[.88,1.08,.92]);
    P.neck=cyl('neck',.055,skin);
    P.torso=sph('torso',1,top,[.29,.48,.19]);
    P.abs=sph('abs',1,top,[.23,.30,.16]);
    P.pelvis=sph('pelvis',1,shorts,[.27,.21,.20]);
    ['lua','rua'].forEach(k=>cyl(k,.073,skin));['lfa','rfa'].forEach(k=>cyl(k,.062,skin));
    ['lth','rth'].forEach(k=>cyl(k,.103,skin));['lsh','rsh'].forEach(k=>cyl(k,.079,skin));
    P.lhand=sph('lhand',.072,skin,[.72,.48,1.05]);P.rhand=sph('rhand',.072,skin,[.72,.48,1.05]);
    P.lfoot=new THREE.Mesh(new THREE.BoxGeometry(.15,.09,.28),shoe);P.rfoot=P.lfoot.clone();root.add(P.lfoot,P.rfoot);
    P.lfoot.castShadow=P.rfoot.castShadow=true;
    // subtle anatomical shoulder caps / knees in same material: no bright points.
    ['lshoulder','rshoulder'].forEach(k=>sph(k,.09,skin,[1,1,.92]));
    ['lknee','rknee'].forEach(k=>sph(k,.083,skin,[.92,.90,.88]));
    const overlays={};
    overlays.chestL=sph('heat_chestL',.105,hot,[1.15,.64,.42]);overlays.chestR=sph('heat_chestR',.105,hot,[1.15,.64,.42]);
    overlays.back=sph('heat_back',.18,backHot,[1.55,1.75,.18]);overlays.core=sph('heat_core',.12,coreHot,[1.25,1.55,.35]);
    overlays.quadL=sph('heat_quadL',.10,legHot,[.65,1.65,.42]);overlays.quadR=sph('heat_quadR',.10,legHot,[.65,1.65,.42]);
    overlays.glute=sph('heat_glute',.13,legHot,[1.35,.75,.40]);
    Object.values(overlays).forEach(m=>m.visible=false);

    function applyPose(q,heat){
      const sm=[(q.ls[0]+q.rs[0])/2,(q.ls[1]+q.rs[1])/2,(q.ls[2]+q.rs[2])/2],
            hm=[(q.lh[0]+q.rh[0])/2,(q.lh[1]+q.rh[1])/2,(q.lh[2]+q.rh[2])/2];
      P.head.position.set(...q.head);between(P.neck,q.neck,sm,.95);
      // torso uses local ellipsoid aligned to spine
      const A=new THREE.Vector3(...sm),B=new THREE.Vector3(...hm),dir=B.clone().sub(A),mid=A.clone().add(B).multiplyScalar(.5);
      P.torso.position.copy(A.clone().lerp(B,.38));P.torso.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),dir.clone().normalize());
      P.abs.position.copy(A.clone().lerp(B,.72));P.abs.quaternion.copy(P.torso.quaternion);P.pelvis.position.set(...hm);P.pelvis.quaternion.copy(P.torso.quaternion);
      between(P.lua,q.ls,q.le,.96);between(P.lfa,q.le,q.lw,.94);between(P.rua,q.rs,q.re,.96);between(P.rfa,q.re,q.rw,.94);
      between(P.lth,q.lh,q.lk,1.0);between(P.lsh,q.lk,q.la,1.0);between(P.rth,q.rh,q.rk,1.0);between(P.rsh,q.rk,q.ra,1.0);
      P.lhand.position.set(...q.lw);P.rhand.position.set(...q.rw);P.lfoot.position.set(...q.la);P.rfoot.position.set(...q.ra);
      P.lfoot.position.z+=.08;P.rfoot.position.z+=.08;
      P.lshoulder.position.set(...q.ls);P.rshoulder.position.set(...q.rs);P.lknee.position.set(...q.lk);P.rknee.position.set(...q.rk);
      const chestY=(sm[1]*.72+hm[1]*.28),chestZ=(sm[2]*.72+hm[2]*.28);
      overlays.chestL.position.set(sm[0]-.105,chestY,chestZ+.17);overlays.chestR.position.set(sm[0]+.105,chestY,chestZ+.17);
      overlays.back.position.set((sm[0]+hm[0])/2,(sm[1]+hm[1])/2,(sm[2]+hm[2])/2-.17);
      overlays.core.position.set((sm[0]+hm[0])/2,(sm[1]+hm[1])/2-.12,(sm[2]+hm[2])/2+.15);
      overlays.quadL.position.set((q.lh[0]+q.lk[0])/2,(q.lh[1]+q.lk[1])/2,(q.lh[2]+q.lk[2])/2+.07);
      overlays.quadR.position.set((q.rh[0]+q.rk[0])/2,(q.rh[1]+q.rk[1])/2,(q.rh[2]+q.rk[2])/2+.07);
      overlays.glute.position.set(hm[0],hm[1],hm[2]-.16);
      if(heat){
        Object.entries(overlays).forEach(([k,m])=>{const v=heat[k]??0;m.visible=v>.03;m.material.opacity=.18+.62*Math.min(1,v);});
      }
    }
    return {root,P,overlays,applyPose};
  }

  function exerciseHeat(id){
    const e=EXERCISES.find(x=>x.id===id)||{},s=((e.muscle||'')+' '+(e.pattern||'')).toLowerCase();
    return {
      chestL:/ngực|chest|push/.test(s)?.9:.05,chestR:/ngực|chest|push/.test(s)?.9:.05,
      back:/lưng|xô|lat|back|pull/.test(s)?.9:.05,
      core:/core|bụng|abs|oblique/.test(s)?.85:.12,
      quadL:/đùi|quad|legs|squat|lunge/.test(s)?.85:.04,quadR:/đùi|quad|legs|squat|lunge/.test(s)?.85:.04,
      glute:/mông|glute|legs/.test(s)?.75:.03
    };
  }
  function profileHeat(){
    const m={push:0,pull:0,legs:0,core:0},hist=state.v24?.exerciseHistory||{};
    Object.entries(hist).forEach(([id,arr])=>{const e=EXERCISES.find(x=>x.id===id);if(!e)return;(arr||[]).forEach(x=>m[e.pattern]+=(x.reps||0)+(x.holdSec||0)/5+1)});
    const mx=Math.max(1,m.push,m.pull,m.legs,m.core);
    return {chestL:m.push/mx,chestR:m.push/mx,back:m.pull/mx,core:m.core/mx,quadL:m.legs/mx,quadR:m.legs/mx,glute:m.legs/mx};
  }

  function cameraBounds(frames){
    const vals=[];frames.forEach(p=>Object.values(p).forEach(v=>Array.isArray(v)&&v.length===3&&vals.push(v)));
    let min=[9,9,9],max=[-9,-9,-9];vals.forEach(v=>v.forEach((x,i)=>{min[i]=Math.min(min[i],x);max[i]=Math.max(max[i],x)}));
    const center=min.map((x,i)=>(x+max[i])/2),span=Math.max(...max.map((x,i)=>x-min[i]),1.4);
    return {center,span};
  }

  function mount3D(host,{id=null,profile=false}={}){
    if(!host||host.dataset.v33Mounted)return;host.dataset.v33Mounted='1';
    const loading=host.querySelector('.v33-loading');
    ensureThree().then(()=>{
      if(!document.body.contains(host))return;
      const {scene,camera,renderer,low}=setupRenderer(host);
      const human=makeAthleticHuman(scene,profile?'profile':'exercise');
      const motion=profile?null:motionFor(id),frames=profile?[baseStand()]:motion.frames;
      const bounds=cameraBounds(frames),target=new THREE.Vector3(...bounds.center),dist=Math.max(3.2,bounds.span*2.15);
      camera.position.set(target.x+dist*.72,target.y+Math.max(.3,bounds.span*.14),target.z+dist*.82);camera.lookAt(target);
      // simple apparatus for mapped motions
      if(!profile){try{fpAddStaticProps(scene,mappedMotion(id))}catch(_){}}
      let yaw=.25,paused=false,speed=motion?.speed||1,start=performance.now(),pausedAt=null,last=0,drag=false,lastX=0,disposed=false;
      const heat=profile?profileHeat():exerciseHeat(id);
      const base=profile?baseStand():null;
      function resize(){const r=host.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
      resize();const ro=new ResizeObserver(resize);ro.observe(host);
      function poseIdle(now){
        const q=cp(base),t=now/1000;
        const breathe=Math.sin(t*1.7)*.015,sway=Math.sin(t*.7)*.015;
        ['head','neck','ls','rs','le','re','lw','rw'].forEach(k=>{q[k][1]+=breathe});
        q.head[0]+=sway;q.neck[0]+=sway*.6;q.lw[0]-=.012*Math.sin(t*.8);q.rw[0]+=.012*Math.sin(t*.8);
        return q;
      }
      function frame(now){
        if(disposed)return;
        if(!document.body.contains(host)){disposed=true;ro.disconnect();renderer.dispose();V33.instances.delete(host.id);return}
        requestAnimationFrame(frame);
        if(low&&now-last<31)return;last=now;
        let p,phase='Idle';
        if(profile){p=poseIdle(paused&&pausedAt?pausedAt:now);phase='Idle breathing'}
        else{const s=sampleMotion(motion,now,start,speed,paused?pausedAt:null);p=s.p;phase=s.phase}
        human.applyPose(p,heat);human.root.rotation.y=yaw;
        renderer.render(scene,camera);
        const phaseEl=host.parentElement?.querySelector('.v33-phase');if(phaseEl)phaseEl.textContent=phase;
      }
      function setView(name){
        const pos={front:[target.x,target.y,target.z+dist],side:[target.x+dist,target.y,target.z],back:[target.x,target.y,target.z-dist],three:[target.x+dist*.72,target.y,target.z+dist*.82]}[name]||[target.x+dist*.72,target.y,target.z+dist*.82];
        camera.position.set(...pos);camera.lookAt(target);yaw=0;
      }
      renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;renderer.domElement.setPointerCapture?.(e.pointerId)});
      renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-lastX)*.012;lastX=e.clientX}});
      renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
      const api={setView,toggle(){paused=!paused;if(paused)pausedAt=performance.now();else{if(pausedAt)start+=performance.now()-pausedAt;pausedAt=null}return paused},speed(v){speed=v;start=performance.now()},dispose(){disposed=true;ro.disconnect();renderer.dispose()}};
      V33.instances.set(host.id,api);
      if(loading)loading.remove();
      requestAnimationFrame(frame);
    }).catch(err=>{
      host.innerHTML=`<div class="v33-webgl-fallback"><div><b>Không khởi tạo được Real 3D Engine</b><span>Bản V3.4 cần Internet lần đầu để tải WebGL engine khi chạy Standalone.<br>Hãy dùng bản Netlify hoặc kiểm tra kết nối mạng.</span><br><small>${String(err.message||err)}</small></div></div>`;
    });
  }

  function exerciseMarkup(id,profile=false){
    const e=EXERCISES.find(x=>x.id===id)||{name:id};
    return `<div class="v33-card"><div class="v33-cardhead"><div><h3>${profile?'3D Athlete Profile':'White Muscle Motion Coach'}</h3><small>${profile?'Idle animation + training heatmap':e.name+' • white anatomical mannequin • scene-bound props'}</small></div><span class="v30-tag">V3.6 SceneRig</span></div>
      <div class="v33-viewer ${profile?'v33-profile3d':''}" id="${profile?'v33-profile-main':'v33-ex-'+id}">
        <div class="v33-loading"><div><b>Đang khởi tạo Real 3D…</b><span>Volumetric humanoid • mobile optimized</span></div></div>
        <div class="v33-badge"><span class="live">● REAL 3D</span><span>${profile?'IDLE + HEATMAP':'MOTION + MUSCLE'}</span></div>
      </div>
      <div class="v33-controls">
        <button onclick="v33View('${profile?'v33-profile-main':'v33-ex-'+id}','front')">Trước</button>
        <button onclick="v33View('${profile?'v33-profile-main':'v33-ex-'+id}','side')">Ngang</button>

      <div class="sub v33-phase" style="margin-top:8px">${profile?'Idle breathing':'Đang tải motion…'}</div>

  window.v33View=(id,v)=>V33.instances.get(id)?.setView(v);
