  // Replace exercise guide viewer with true WebGL 3D.
  window.visualDemo=function(e){
    const g=guideFor(e.id);
    return `<div class="visualdemo pro"><div class="visualtop"><b>🧍 Real 3D Coach • ${e.name}</b><span>V3.4 • volumetric mannequin • drag để xoay</span></div>${exerciseMarkup(e.id,false)}
      <div class="coachchips">${(g.cues||[]).slice(0,3).map(x=>`<span class="coachchip">${x}</span>`).join('')}</div></div>`;
  };
  try{visualDemo=window.visualDemo}catch(_){}

  // Guide opening mounts actual WebGL viewer.
  const oldToggleGuide=window.toggleGuide;
  window.toggleGuide=function(id){
    const el=document.getElementById('guide-'+id);if(!el)return;
    el.classList.toggle('open');
    if(el.classList.contains('open'))setTimeout(()=>{const host=document.getElementById('v33-ex-'+id);mount3D(host,{id})},40);
  };
  try{toggleGuide=window.toggleGuide}catch(_){}

  // Exercise detail receives a dedicated full Real 3D viewer.
  window.v24ExercisePage=function(id){
    let html=typeof BASE_DETAIL==='function'?BASE_DETAIL(id):'';
    const pos=html.indexOf('<main>');
    if(pos>=0)html=html.slice(0,pos+6)+exerciseMarkup(id,false)+html.slice(pos+6);
    return html;
  };
  try{v24ExercisePage=window.v24ExercisePage}catch(_){}

  function enhanceProfile(){
    if(state.tab!=='progress'||state.v31?.progressView!=='overview')return;
    const grids=[...document.querySelectorAll('.v31-bodyGrid')];
    if(!grids.length)return;
    grids.forEach((grid,i)=>{
      const holder=document.createElement('div');holder.innerHTML=exerciseMarkup('profile',true);
      const card=holder.firstElementChild;
      grid.replaceWith(card);
      const v=card.querySelector('.v33-viewer');
      if(i>0&&v)v.id='v33-profile-'+i;
      mount3D(v,{profile:true});
    });
  }
  function enhanceExerciseDetail(){
    if(!state.exerciseDetail)return;
    const host=document.getElementById('v33-ex-'+state.exerciseDetail);if(host)mount3D(host,{id:state.exerciseDetail});
  }
  function enhanceSettings(){
    if(state.tab!=='progress'||state.v31?.progressView!=='settings')return;
    const main=document.querySelector('#app main');if(!main||main.querySelector('#v33-quality-card'))return;
    main.insertAdjacentHTML('beforeend',`<div class="v30-settingcard" id="v33-quality-card"><div class="row between"><div><h4 style="margin:0">Real 3D Engine</h4><div class="sub">Chất lượng render cho thiết bị</div></div><span class="v30-tag">V3.4</span></div><div class="v33-quality">${['auto','low','high'].map(k=>`<button class="${state.v33.quality===k?'on':''}" onclick="state.v33.quality='${k}';save();render()">${k.toUpperCase()}</button>`).join('')}</div><p class="sub">AUTO giới hạn pixel ratio trên mobile. Model hiện là athletic mannequin WebGL tạo trực tiếp; engine đã sẵn sàng để thay bằng GLB asset ngoài ở bản production.</p></div>`);
  }
  function enhance(){
    setTimeout(()=>{enhanceProfile();enhanceExerciseDetail();enhanceSettings()},20);
  }

  function renderV33(){BASE_RENDER();enhance()}
  window.render=renderV33;
  window.nav=function(tab){BASE_NAV(tab);enhance()};
  try{render=renderV33}catch(_){}
  // Existing init3D calls from old paths now mount our true 3D engine.
  window.init3D=function(id){const host=document.getElementById('v33-ex-'+id)||document.getElementById('viewer-'+id);if(host)mount3D(host,{id})};
  try{init3D=window.init3D}catch(_){}

  renderV33();
})();
</script>

<script id="v34-anatomical-heatmap">

  ];

  function heatColor(p){
    if(p>=.72)return '#ff5656';
    if(p>=.42)return '#ffd54a';

  }
  function heatAlpha(p){return Math.max(.04,.12+p*.72).toFixed(3)}

  function rangeCutoff(){
    if(state.v34.range==='7d')return Date.now()-7*864e5;
    if(state.v34.range==='30d')return Date.now()-30*864e5;

  }

  function weightsFor(ex){
    const s=((ex.name||'')+' '+(ex.muscle||'')+' '+(ex.pattern||'')).toLowerCase();
    const w={};
    const add=(k,v)=>w[k]=(w[k]||0)+v;
    // pattern baseline
    if(ex.pattern==='push'){add('chest',.42);add('shoulders',.28);add('triceps',.30)}
    if(ex.pattern==='pull'){add('lats',.36);add('upperBack',.27);add('biceps',.22);add('forearms',.15)}
    if(ex.pattern==='legs'){add('quads',.34);add('glutes',.28);add('hamstrings',.22);add('calves',.10);add('adductors',.06)}
    if(ex.pattern==='core'){add('abs',.56);add('obliques',.25);add('lowerBack',.19)}
    // keyword refinements
    const rules=[
      ['chest',/ngực|chest|pec/,.42],['shoulders',/vai|shoulder|delt|handstand|pike/,.40],
      ['biceps',/biceps|tay trước|curl|chin.?up/,.42],['triceps',/triceps|tay sau|dip|extension|hspu/,.42],
      ['forearms',/forearm|cẳng tay|grip|hang/,.35],['abs',/abs|bụng|crunch|hollow|dragon flag|v.?up|l.?sit/,.44],
      ['obliques',/oblique|xiên|twist|side plank|pallof|windshield/,.45],
      ['upperBack',/upper back|lưng trên|rhomboid|rear delt|face pull|row/,.38],
      ['lats',/lat|xô|pull.?up|pulldown|front lever/,.42],['lowerBack',/lower back|lưng dưới|good morning|rdl|superman/,.36],
      ['glutes',/glute|mông|hip thrust|bridge|lunge|bulgarian/,.42],['quads',/quad|đùi trước|squat|pistol|step.?up/,.42],
      ['hamstrings',/hamstring|gân kheo|rdl|leg curl|good morning/,.46],['calves',/calf|bắp chân|pogo/,.52],
      ['adductors',/adductor|đùi trong|sumo|cossack/,.50]
    ];
    rules.forEach(([k,r,v])=>{if(r.test(s))add(k,v)});
    const total=Object.values(w).reduce((a,b)=>a+b,0)||1;
    Object.keys(w).forEach(k=>w[k]/=total);
    return w;
  }

  function muscleData(){
    const cutoff=rangeCutoff(),scores={},logs={},exerciseScore={},last={};
    Object.keys(MUSCLES).forEach(k=>{scores[k]=0;logs[k]=0;exerciseScore[k]={};last[k]=0});
    const hist=state.v24?.exerciseHistory||{};
    Object.entries(hist).forEach(([id,arr])=>{
      const ex=EXERCISES.find(e=>e.id===id);if(!ex)return;
      const weights=weightsFor(ex);
      (arr||[]).forEach(x=>{
        const dt=+(x.date||0);if(cutoff&&dt<cutoff)return;
        const load=Math.max(1,(x.reps||0)+(x.holdSec||0)/5) * (.75+Math.max(0,3-(x.rir??2))*.08) * (.65+Math.min(100,x.form||85)/250);
        Object.entries(weights).forEach(([k,w])=>{
          scores[k]+=load*w;logs[k]+=1;exerciseScore[k][id]=(exerciseScore[k][id]||0)+load*w;last[k]=Math.max(last[k],dt);
        });
      });
    });
    const max=Math.max(1,...Object.values(scores));
    const norm={};Object.keys(scores).forEach(k=>norm[k]=scores[k]/max);
    return {scores,norm,logs,exerciseScore,last,max};
  }

  function topExercises(data,key){
    return Object.entries(data.exerciseScore[key]||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([id])=>EXERCISES.find(e=>e.id===id)?.name||id);
  }
  function totalSets(){
    const cutoff=rangeCutoff(),hist=state.v24?.exerciseHistory||{};
    return Object.values(hist).reduce((n,a)=>n+(a||[]).filter(x=>!cutoff||+(x.date||0)>=cutoff).length,0);
  }
  function balanceScore(data){
    const vals=['chest','lats','quads','hamstrings','abs','glutes'].map(k=>data.norm[k]||0).filter(x=>x>0);
    if(vals.length<2)return 0;
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length,dev=vals.reduce((a,b)=>a+Math.abs(b-avg),0)/vals.length;
    return Math.max(0,Math.round((1-dev/Math.max(.01,avg))*100));
  }

  function mapMarkup(){
    const data=muscleData(),key=state.v34.selected in MUSCLES?state.v34.selected:'chest',m=MUSCLES[key],top=topExercises(data,key),
          score=data.scores[key]||0,power=data.norm[key]||0,last=data.last[key]||0;

    }).join('');
    const legend=Object.entries(MUSCLES).map(([k,v])=>`<button style="color:${v.color}" class="${(data.norm[k]||0)>.35?'hot':''}" onclick="v34SelectMuscle('${k}')"><i style="background:${v.color}"></i>${v.name}</button>`).join('');
    return `<div class="v34-anatomy-card" id="v34-anatomy">
      <div class="v34-anatomy-head">
        <div><div class="v30-tag">PROFILE HEATMAP • V3.4</div><h3 style="margin-top:8px">Anatomical Muscle Map</h3><p>Front + Back • xanh = nhẹ • vàng = vừa • đỏ = mạnh</p></div>
        <div class="v34-range">
          ${[['7d','7 ngày'],['30d','30 ngày'],['all','Tất cả']].map(([k,l])=>`<button class="${state.v34.range===k?'on':''}" onclick="v34SetRange('${k}')">${l}</button>`).join('')}
        </div>
      </div>
      <div class="v34-map-shell">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Muscles_front_and_back.svg/960px-Muscles_front_and_back.svg.png"
             alt="Anatomical front and back muscular system"
             onerror="this.style.opacity='.12'">
        <div class="v34-map-overlay">${zones}</div>
        ${totalSets()===0?'<div class="v34-empty">Chưa có dữ liệu set trong khoảng thời gian này. Heatmap sẽ tự sáng lên sau khi bạn hoàn thành workout.</div>':''}
      </div>
      <div class="v34-muscle-detail" style="--muscleColor:${m.color}">
        <div class="v34-muscle-title"><div><small class="sub">Đang chọn</small><h4>${m.name}</h4></div><span class="v34-score">${Math.round(power*100)}% heat</span></div>
        <div class="v34-stats">
          <div class="v34-stat"><b>${score.toFixed(1)}</b><span>VOLUME POINTS</span></div>
          <div class="v34-stat"><b>${data.logs[key]||0}</b><span>LOGGED SETS</span></div>
          <div class="v34-stat"><b>${last?new Date(last).toLocaleDateString():'—'}</b><span>LAST TRAINED</span></div>
          <div class="v34-stat"><b>${top.length}</b><span>TOP EXERCISES</span></div>
        </div>
        <div class="v34-top-ex">${top.length?top.map(x=>`<span>${x}</span>`).join(''):'<span>Chưa có bài tác động trong khoảng này</span>'}</div>
      </div>
      <div class="v34-balance">
        <div><b>${balanceScore(data)}%</b><small>MUSCLE BALANCE</small></div>
        <div><b>${totalSets()}</b><small>TOTAL LOGS</small></div>
        <div><b>${Object.values(data.scores).filter(x=>x>0).length}/${Object.keys(MUSCLES).length}</b><small>GROUPS TRAINED</small></div>
      </div>
      <div class="v34-legend">${legend}</div>
      <div class="v34-credit">Anatomical base: “Muscles front and back.svg” — OpenStax, Tomáš Kebert & umimeto.org, CC BY-SA 4.0. ForgePath overlays training-data heatmap; base anatomy is used with attribution.</div>
    </div>`;
  }

  window.v34SelectMuscle=function(k){state.v34.selected=k;save();const old=document.getElementById('v34-anatomy');if(old){const box=document.createElement('div');box.innerHTML=mapMarkup();old.replaceWith(box.firstElementChild)}};
  window.v34SetRange=function(k){state.v34.range=k;save();const old=document.getElementById('v34-anatomy');if(old){const box=document.createElement('div');box.innerHTML=mapMarkup();old.replaceWith(box.firstElementChild)}};

  function replaceProfile3D(){
    if(state.tab!=='progress'||state.v31?.progressView!=='overview')return;
    const profileHost=document.getElementById('v33-profile-main');
    if(profileHost){
      const card=profileHost.closest('.v33-card');
      if(card){
        const box=document.createElement('div');box.innerHTML=mapMarkup();card.replaceWith(box.firstElementChild);
      }
    }
    // In case V3.3 did not mount yet, replace original front/back body grid directly.
    const grids=[...document.querySelectorAll('.v31-bodyGrid')];
    grids.forEach(grid=>{
      if(grid.closest('#v34-anatomy'))return;
      const parent=grid.closest('.v31-heroBody')||grid.parentElement;
      if(parent){
        const box=document.createElement('div');box.innerHTML=mapMarkup();
        parent.replaceWith(box.firstElementChild);
      }
    });
  }

  function removeProfile3DLabels(){
    document.querySelectorAll('.v33-cardhead h3').forEach(h=>{
      if(/3D Athlete Profile/i.test(h.textContent||'')){
        const card=h.closest('.v33-card');if(card){const box=document.createElement('div');box.innerHTML=mapMarkup();card.replaceWith(box.firstElementChild)}
      }
    });
  }

  function enhanceV34(){
    setTimeout(()=>{replaceProfile3D();removeProfile3DLabels()},35);
    setTimeout(()=>{replaceProfile3D();removeProfile3DLabels()},140);
  }
  function renderV34(){PREV_RENDER();enhanceV34()}
  window.render=renderV34;
  window.nav=function(tab){PREV_NAV(tab);enhanceV34()};
  try{render=renderV34}catch(_){}
  enhanceV34();
})();
</script>

<script id="v35-scenerig-override">
(()=>{
  const PREV_INIT=window.init3D;
  const PREV_VISUAL=window.visualDemo;
  const PREV_RENDER=window.render;
  const PREV_NAV=window.nav;
  const REG={};
  function ensureThree(){
    if(window.THREE)return Promise.resolve(window.THREE);
    if(window.__FP_THREE_PROMISE)return window.__FP_THREE_PROMISE;
    const urls=['./vendor/three.min.js','https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js','https://unpkg.com/three@0.146.0/build/three.min.js'];
    window.__FP_THREE_PROMISE=new Promise((resolve,reject)=>{
      let i=0;
      const next=()=>{
        if(window.THREE){window.__FP_THREE_STATE='ready';return resolve(window.THREE)}
        if(i>=urls.length){window.__FP_THREE_STATE='failed';return reject(new Error('Không tải được Three.js'))}
        const s=document.createElement('script');
        s.src=urls[i++]; s.async=true; s.crossOrigin='anonymous';
        s.onload=()=>window.THREE?(window.__FP_THREE_STATE='ready',resolve(window.THREE)):next();
        s.onerror=next; document.head.appendChild(s);
      };
      next();
    });
    return window.__FP_THREE_PROMISE;
  }
  function sceneMotionId(id){
    const e=(window.EXERCISES||[]).find(x=>x.id===id)||{}; const n=((id||'')+' '+(e.name||'')).toLowerCase();
    if(/pushup|push-up|diamond|archer|knee|wall/.test(n))return /wall/.test(n)?'wall_pushup':'pushup';
    if(/incline/.test(n))return 'incline_pushup'; if(/decline/.test(n))return 'decline_pushup';
    if(/dip/.test(n))return 'chair_dip'; if(/pike|handstand|hspu|planche/.test(n))return 'elevated_pike';
    if(/pullup|pull-up|chinup|chin-up|muscle.?up/.test(n))return 'pullup'; if(/hang|front lever|back lever/.test(n))return 'dead_hang';
    if(/row|face pull|pull-apart/.test(n))return 'band_row'; if(/curl/.test(n))return 'band_facepull';
    if(/bulgarian/.test(n))return 'bulgarian'; if(/split|lunge|step-up|step up/.test(n))return 'split_squat';
    if(/squat|pistol|wall sit/.test(n))return /pistol/.test(n)?'assisted_pistol':'squat';
    if(/rdl|deadlift|good morning|hinge/.test(n))return 'db_rdl'; if(/bridge|hip thrust|frog pump/.test(n))return 'glute_bridge';
    if(/calf/.test(n))return 'calf_raise'; if(/hanging|toes.?to.?bar|knee raise/.test(n))return 'hanging_knee';
    if(/l.?sit/.test(n))return 'lsit'; if(/plank|bear crawl|body saw/.test(n))return 'plank';
    if(/leg raise|dragon flag|crunch|sit-up|reverse crunch/.test(n))return 'leg_raise'; if(/hollow/.test(n))return 'hollow';
    if(/dead bug|bird dog/.test(n))return 'deadbug';
    return e.pattern==='pull'?'band_row':e.pattern==='legs'?'squat':e.pattern==='core'?'plank':'pushup';
  }
  function motionForId(id){ try{return window.fpMotionFor?fpMotionFor(sceneMotionId(id)):null}catch(_){return null} }
  function sceneDefaultView(id){
    const m=sceneMotionId(id);
    if(['pushup','incline_pushup','decline_pushup','wall_pushup','chair_dip','elevated_pike','squat','split_squat','bulgarian','assisted_pistol','db_rdl','glute_bridge','plank','leg_raise','deadbug','hollow','lsit'].includes(m))return 'side';
    if(['pullup','dead_hang','hanging_knee','band_row'].includes(m))return 'three';
    return 'three';
  }
  function scenePreset(id){
    const m=sceneMotionId(id);
    if(['pullup','dead_hang','hanging_knee'].includes(m))return {target:[0,1.55,0],dist:5.7,y:2.45};
    if(['pushup','incline_pushup','decline_pushup','wall_pushup','chair_dip','elevated_pike','plank','glute_bridge','deadbug','hollow','leg_raise'].includes(m))return {target:[0,.92,.22],dist:5.6,y:1.95};
    if(['squat','split_squat','bulgarian','assisted_pistol','db_rdl','calf_raise'].includes(m))return {target:[0,1.18,0],dist:5.35,y:2.15};
    if(['lsit'].includes(m))return {target:[0,1.12,.1],dist:5.0,y:2.0};
    return {target:[0,1.22,0],dist:5.4,y:2.15};
  }
  function lerpPose(a,b,t){const o={};for(const k in a)o[k]=a[k].map((v,i)=>v+(b[k][i]-v)*t);return o}
  function sampleMotion(motion,now,start,speed,pausedAt){
    if(!motion)return {p:window.baseStand?baseStand():null,phase:'Idle'};
    if(motion.hold)return {p:JSON.parse(JSON.stringify(motion.frames[0])),phase:(motion.phases&&motion.phases[0])||'Hold'};
    const c=(((pausedAt??now)-start)/1000)*speed,frames=motion.frames;
    if(frames.length===2){const u=c%2,fw=u<1,t=fw?u:2-u,e=.5-.5*Math.cos(Math.PI*t);return {p:lerpPose(frames[0],frames[1],e),phase:fw?((motion.phases&&motion.phases[1])||'Pha chính'):'Trở về'}}
    const s=Math.floor(c)%frames.length,n=(s+1)%frames.length,t=c-Math.floor(c),e=.5-.5*Math.cos(Math.PI*t);
    return {p:lerpPose(frames[s],frames[n],e),phase:(motion.phases&&motion.phases[s])||'Chuyển động'};
  }
  function createRig(scene){
    const THREE=window.THREE,root=new THREE.Group(); scene.add(root);
    const white=new THREE.MeshPhysicalMaterial({color:0xf3f6f8,roughness:.58,metalness:.03,clearcoat:.16,clearcoatRoughness:.55});
    const white2=new THREE.MeshPhysicalMaterial({color:0xe8edf1,roughness:.56,metalness:.04,clearcoat:.14});
    const accent=new THREE.MeshPhysicalMaterial({color:0xdfe7ec,roughness:.44,metalness:.06});
    const hotMat=c=>new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:.92,emissive:new THREE.Color(c),emissiveIntensity:.28});
    const parts={},muscles={};
    const sph=(r,mat,s=[1,1,1])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,26,20),mat);m.scale.set(...s);m.castShadow=m.receiveShadow=true;root.add(m);return m};

<script id="v37-rigged-glb-upgrade">
(()=>{
  // V3.7: local-first GLB rig layer. Keeps V3.6 UI and V3.5 scene/contact fallback intact.
  const MODEL_URL='./assets/models/forgepath-human.glb';
  const LOADER_URLS=['./vendor/GLTFLoader.js','https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js','https://unpkg.com/three@0.146.0/examples/js/loaders/GLTFLoader.js'];
  window.FP_RIGGED_MODEL={url:MODEL_URL,license:'CC0-1.0',source:'Quaternius / UMRAM-Bilkent supine-human-model',status:'local-first'};
  function ensureLoader(){
    if(window.THREE&&THREE.GLTFLoader)return Promise.resolve(THREE.GLTFLoader);
    if(window.__FP_GLTF_PROMISE)return window.__FP_GLTF_PROMISE;
    window.__FP_GLTF_PROMISE=new Promise((resolve,reject)=>{let i=0;const next=()=>{
      if(window.THREE&&THREE.GLTFLoader)return resolve(THREE.GLTFLoader);
      if(i>=LOADER_URLS.length)return reject(new Error('GLTFLoader unavailable'));
      const el=document.createElement('script');el.src=LOADER_URLS[i++];el.async=true;el.onload=next;el.onerror=next;document.head.appendChild(el);
    };next();}); return window.__FP_GLTF_PROMISE;
  }
  window.fpLoadRiggedHuman=async function(scene){
    await ensureLoader();
    return new Promise((resolve,reject)=>{
      new THREE.GLTFLoader().load(MODEL_URL,g=>{

  };
  window.visualDemo=function(e,pro=false){const g=guideFor(e.id),mus=muscleZonesFor(e).map(x=>MUSCLE_LABELS[x]||x);return `<div class="visualdemo ${pro?'pro':''}"><div class="visualtop"><b>🤍 Motion Coach • ${e.name}</b><span>${VERSION} • White muscular mannequin • scene-bound props</span></div><div class="viewer3d" id="viewer-${e.id}"><div class="viewer-canvas"><div class="viewerloading">Đang chuẩn bị mannequin…</div></div><div class="coach-hud"><div class="hudcard"><b class="phasebadge" id="phase-${e.id}">Khởi tạo</b><span>Pha chuyển động</span></div><div class="hudcard anglebadge"><b id="angle-${e.id}">White mannequin</b><span>Prop/contact lock</span></div></div><div class="coach-bottom-hud">${mus.map(x=>`<span class="musclepill">${x}</span>`).join('')}${(g.cues||[]).slice(0,2).map(x=>`<span class="cuepill">${x}</span>`).join('')}</div></div><div class="viewcontrols"><button class="btn" onclick="demoView('${e.id}','front')">Trước</button><button class="btn" onclick="demoView('${e.id}','side')">Ngang</button><button class="btn" onclick="demoView('${e.id}','back')">Sau</button><button class="btn" onclick="demoView('${e.id}','three')">3/4</button></div><div class="democontrols"><button class="btn" onclick="demoToggle('${e.id}',this)">⏸ Pause</button><button class="btn" onclick="demoSpeed('${e.id}',.5)">0.5×</button><button class="btn" onclick="demoSpeed('${e.id}',1)">1×</button></div><div class="model-note">V3.12 bỏ GLB low-poly/capsule look. Motion Coach dùng white muscular mannequin mượt hơn; Home/Profile vẫn dùng anatomical SVG path riêng cho từng nhóm cơ.</div></div>`};
  window.renderGuide=function(e){const g=guideFor(e.id);return `<button class="guidebtn" onclick="toggleGuide('${e.id}')"><span>🤍 White Motion Coach 3D & kỹ thuật</span><span>⌄</span></button><div class="guide" id="guide-${e.id}">${window.visualDemo(e)}<div class="coach-summary"><div class="quickcue"><b>✅ Form nhanh</b><span>${(g.cues||[]).slice(0,2).join(' • ')}</span></div><div class="quickcue safetycue"><b>⚠️ Tránh</b><span>${(g.mistakes||[]).slice(0,2).join(' • ')}</span></div></div><h4 style="margin-top:14px">Chuẩn bị</h4><p>${g.setup}</p><h4>Cách thực hiện</h4><ul>${g.steps.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Điểm cần nhớ</h4><ul>${g.cues.map(x=>`<li>${x}</li>`).join('')}</ul><h4 class="warning">Lỗi thường gặp</h4><ul class="warning">${g.mistakes.map(x=>`<li>${x}</li>`).join('')}</ul><div class="breath">🫁 ${g.breathing}</div></div>`};
  try{init3D=window.init3D;visualDemo=window.visualDemo;renderGuide=window.renderGuide}catch(_){ }

  const prevRender=window.render,prevNav=window.nav;window.render=function(){const r=prevRender.apply(this,arguments);setTimeout(patchMaps,0);setTimeout(patchMaps,80);return r};window.nav=function(){const r=prevNav.apply(this,arguments);setTimeout(patchMaps,0);setTimeout(patchMaps,80);return r};
  let timer=0;new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(patchMaps,40)}).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
  setTimeout(patchMaps,0);setTimeout(patchMaps,180);
})();

</script>
